            inspect(source);
            assert.ok(names.length); assert.equal(new Set(names).size, names.length, 'DUPLICATE_ROOT');
            return names;
          }

          export function schedule(names, count = 8) {
            assert.ok(names.length && names.every(n => typeof n === 'string' && n.length));
            assert.equal(new Set(names).size, names.length, 'DUPLICATE_ROOT');
            const units = names.map(name => [name]);
            for (let i = 0; i < units.length; i++) for (let j = i + 1; j < units.length;) {
              if (units[i].some(a => units[j].some(b => a.startsWith(b + ' ') || b.startsWith(a + ' ')))) {
                units[i].push(...units.splice(j, 1)[0]); j = i + 1;
              } else j++;
            }
            const escape = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const groups = Array.from({ length: count }, () => []);
            units.forEach((roots, index) => {
              const pattern = `^(?:${roots.map(escape).join('|')})(?:$| )`, regex = new RegExp(pattern);
              assert.deepEqual(names.filter(n => regex.test(n)).sort(), [...roots].sort(), 'OVERLAPPING_ROOT_FILTER');
              groups[index % count].push({ index, roots, pattern });
            });
            const all = groups.flat().flatMap(u => u.roots);
            assert.equal(all.length, names.length); assert.equal(new Set(all).size, names.length);
            return groups;
          }

          export async function verdict(file, expected) {
            const roots = new Set(expected ?? []), seenRoots = new Set(), active = new Set(), path = [];
            const descendants = [], summaries = []; let currentRoot, terminals = 0;
            for await (const line of createInterface({ input: createReadStream(file), crlfDelay: Infinity })) {
              const e = JSON.parse(line), d = e.data;
              if (e.type === 'test:summary') { summaries.push(d); continue; }
              if (!['test:start', 'test:pass', 'test:fail'].includes(e.type)) continue;
              assert.ok(Number.isInteger(d.nesting) && d.nesting >= 0 && typeof d.name === 'string');
              if (d.nesting === 0) currentRoot = d.name;
              const selected = expected === undefined || roots.has(currentRoot);
              if (!selected) {
                if (e.type !== 'test:start') assert.ok(d.skip, 'unexpected non-skipped root/descendant');
                continue;
              }
              path.length = d.nesting; path[d.nesting] = d.name;
              const key = JSON.stringify([path, d.file, d.line, d.column]);
              if (e.type === 'test:start') { assert.ok(!active.has(key)); active.add(key); continue; }
              assert.equal(e.type, 'test:pass', 'runner failure'); assert.ok(!d.skip && !d.todo, 'selected test skipped/todo');
              assert.ok(active.delete(key), 'verdict without start'); terminals++;
              if (d.nesting === 0) { assert.ok(!seenRoots.has(d.name)); seenRoots.add(d.name); }
              descendants.push({ path: [...path], testNumber: d.testNumber });
            }
            assert.equal(active.size, 0, 'unfinished selected tests');
            if (expected !== undefined) assert.deepEqual([...seenRoots].sort(), [...roots].sort(), 'ZERO_OR_MISSING_ROOT');
            else assert.ok(seenRoots.size, 'ZERO_ROOT');
            const final = summaries.filter(s => s.file === undefined).at(-1);
            assert.ok(final?.success === true && final.counts, 'MISSING_SUCCESSFUL_SUMMARY');
            for (const s of summaries) {
              assert.equal(s.success, true); for (const k of ['failed', 'cancelled', 'todo']) assert.equal(s.counts[k], 0);
            }
            assert.ok(final.counts.passed >= seenRoots.size && terminals >= seenRoots.size);
            return { roots: [...seenRoots], descendants, summaries };
          }

          export async function runChild({ executable = process.execPath, file, expected, pattern, directory, reporter, cwd = process.cwd(), signal }) {
            await mkdir(directory, { recursive: true });
            const events = join(directory, 'events.ndjson');
            const args = ['--test', ...(pattern ? [`--test-name-pattern=${pattern}`] : []),
              `--test-reporter=${pathToFileURL(reporter).href}`, `--test-reporter-destination=${events}`,
              '--test-reporter=tap', '--test-reporter-destination=stdout', file];
            const out = createWriteStream(join(directory, 'stdout.log')), err = createWriteStream(join(directory, 'stderr.log'));
            let child, failure, interrupted, timer;
            const startedAt = new Date().toISOString(), began = performance.now();
            const stop = reason => {
              failure ??= reason instanceof Error ? reason : Error(String(reason));
              if (child?.pid && child.exitCode === null && child.signalCode === null) {
                // The CLI and its own test worker share a detached Linux process group.
                if (process.platform !== 'win32') { try { process.kill(-child.pid, 'SIGTERM'); } catch {} }
                else child.kill('SIGTERM');
                timer ??= setTimeout(() => {
                  if (process.platform !== 'win32') { try { process.kill(-child.pid, 'SIGKILL'); } catch {} }
                  else child.kill('SIGKILL');
                }, 5000);
              }
            };
            const onSignal = name => { interrupted = name; stop(name); };
            const handlers = new Map(['SIGINT', 'SIGTERM'].map(name => [name, () => onSignal(name)]));
            for (const [name, handler] of handlers) process.on(name, handler);
            const onAbort = () => onSignal('ABORT'); signal?.addEventListener('abort', onAbort, { once: true });
            out.on('error', stop); err.on('error', stop);
            let result;
            try {
              if (signal?.aborted) throw Error('ABORT');
              child = spawn(executable, args, { cwd, env: { ...process.env, XGS_VIDEO_TIMEOUT_TRACE: join(directory, 'phase.ndjson') },
                stdio: ['ignore', 'pipe', 'pipe'], detached: process.platform !== 'win32' });
              child.stdout.pipe(out); child.stderr.pipe(err);
              child.stdout.pipe(process.stdout, { end: false }); child.stderr.pipe(process.stderr, { end: false });
              result = await new Promise(resolveResult => {
                child.once('error', error => { failure ??= error; });
                child.once('close', (code, childSignal) => resolveResult({ code, signal: childSignal }));
              });
              await Promise.all([finished(out), finished(err)]);
              await writeFile(join(directory, 'exit.json'), JSON.stringify({ executable, args, pid: child.pid,
                startedAt, elapsedMs: performance.now() - began, ...result, interrupted, failure: failure?.message }) + '\n');
              if (failure) throw failure;
              assert.equal(result.code, 0, 'nonzero child'); assert.equal(result.signal, null, 'signalled child');
              const receipt = await verdict(events, expected);
              await writeFile(join(directory, 'verdict.json'), JSON.stringify(receipt) + '\n');
              return receipt;
