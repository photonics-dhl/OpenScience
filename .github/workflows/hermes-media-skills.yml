jobs:
  skill-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_WEB_MODE: production
      API_ORIGIN: http://127.0.0.1:3101
      ENABLE_VISUAL_HARNESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
