      - name: Guide layout and contextual companion focus
        run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test vendor-ux.spec.ts --grep "guide hands creation off through the research desk|anonymous guide entry preserves the research desk login destination|Guide lifecycle, media explanations and FAQ|English Guide stays readable on narrow phones|public preview failure has a retry|guide is reachable from common primary navigation" --config playwright.config.ts --workers 1 --max-failures=1 --reporter=line --trace=retain-on-failure --output ../../tmp/hermes-guide-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/presentation-media-retention.test.tsx test/existing-scene-image-review.test.tsx
      - run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test presentation-workbench.spec.ts --grep "saved science retry|saved PNG review-only|rejected scene image remains|private narration result consumer|normal narration audition action|restores a scoped pending task|presentation task read recovery|shows a terminal task failure" --config playwright.config.ts --workers 1 --output ../../tmp/presentation-retry-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/ingestion-review-polling.test.ts test/api-client-contract.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/surface-shells.test.tsx -t "review-only preflight recovery"
      - run: npx pnpm@9.15.0 docs:lint
      - name: Preserve synthetic browser failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-browser-failure-evidence
          path: |
            tmp/illustrated-creation-browser/
            tmp/hermes-entry-browser/
            tmp/hermes-guide-browser/
            tmp/storyboard-lifecycle-browser/
            tmp/media-retention-check/harness.log
            tmp/presentation-retry-browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve page screenshots and Native restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-page-screenshots
          path: |
            apps/web/test/visual/out/**/*.png
            apps/web/test/visual/out/**/*.json
            tmp/hermes-guide-browser/**/*.png
            tmp/native-restore-source-identity/ci-*/
            tmp/release-tooling-telemetry/
          if-no-files-found: ignore
          retention-days: 7

  # Keep complete navigation acceptance in isolated runners with per-case logs.
  browser-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_WEB_MODE: production
      API_ORIGIN: http://127.0.0.1:3101
      ENABLE_VISUAL_HARNESS: '1'
    strategy:
      fail-fast: false
      matrix:
        suite: [hermes-workspace-stage, hermes-dashboard, auth-dashboard, research-continuation]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter '@openscience/web...' build
      - name: Hermes navigation and existing research entry
        run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test '${{ matrix.suite }}.spec.ts' --config playwright.config.ts --workers 1 --reporter=line --trace retain-on-failure --output ../../tmp/hermes-entry-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: Preserve isolated browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-entry-${{ matrix.suite }}
          path: |
            tmp/hermes-entry-browser/
            apps/web/test/visual/out/**/*.png
            apps/web/test/visual/out/**/*.json
          if-no-files-found: ignore
          retention-days: 7
