jobs:
  first-image-grant:
    name: First image grant / real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: image_grant_test
          POSTGRES_PASSWORD: image_grant_ci
          POSTGRES_DB: image_grant_test
        ports: ['127.0.0.1:55440:5432']
        options: >-
          --health-cmd "pg_isready -U image_grant_test -d image_grant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://image_grant_test:image_grant_ci@127.0.0.1:55440/image_grant_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter '@openscience/database^...' build
      - name: Prove the first-image regression against the previous constraint
        shell: bash
        run: |
          mkdir -p tmp/first-image-grant
          candidate=infra/migrations/20261014010000_first_image_generation_grant/migration.sql
          cp "$candidate" tmp/first-image-grant/candidate.sql
          trap 'cp tmp/first-image-grant/candidate.sql "$candidate"' EXIT
          cp infra/migrations/20260922030000_visual_narrative_dynamic_render_repair/migration.sql "$candidate"
          set +e
          npx pnpm@9.15.0 --filter @openscience/database exec vitest run --config vitest.integration.config.ts test/first-image-grant-migration.integration.test.ts -t 'reproduces the old first-image rejection' > tmp/first-image-grant/red.log 2>&1
          red_status=$?
          set -e
          cat tmp/first-image-grant/red.log
          test "$red_status" -ne 0
          # Vitest prefixes stderr with ANSI SGR resets even when redirected.
          # Strip formatting only; still require the exact observed-error marker.
          sed -E 's/\x1B\[[0-9;]*m//g' tmp/first-image-grant/red.log | grep -Fxq 'FIRST_IMAGE_GRANT_OLD_CHECK_REJECTED_TWO_TASK_RUN'
      - name: Verify exact grants, invalid values and safe rollback
        shell: bash
        run: |
          set -o pipefail
          npx pnpm@9.15.0 --filter @openscience/database exec vitest run --config vitest.integration.config.ts test/first-image-grant-migration.integration.test.ts | tee tmp/first-image-grant/green.log
      - name: Lint the migration regression test
        run: npx pnpm@9.15.0 exec eslint packages/database/test/first-image-grant-migration.integration.test.ts
      - name: Build and verify voice on the real test database
        shell: bash
        env:
          NODE_ENV: test
        run: |
          set -o pipefail
          node <<'NODE'
          if (process.env.NODE_ENV !== 'test' || !process.env.DATABASE_URL?.trim()) throw new Error('Explicit test database environment required');
          let url;
          try { url = new URL(process.env.DATABASE_URL); } catch { throw new Error('Invalid test database target'); }
          if (!['postgresql:', 'postgres:'].includes(url.protocol) || url.hostname !== '127.0.0.1'
            || url.port !== '55440' || url.pathname !== '/image_grant_test' || url.hash) throw new Error('Unapproved test database target');
          if ([...url.searchParams.keys()].some(key => key !== 'connection_limit')) throw new Error('Unapproved test database options');
          NODE
          npx pnpm@9.15.0 --filter '@openscience/domain...' build
          npx pnpm@9.15.0 --filter @openscience/database build
          node packages/database/dist/migrate-cli.js deploy
          npx pnpm@9.15.0 --filter @openscience/domain exec vitest run --config vitest.integration.config.ts test/agent/voice-postgres.integration.test.ts | tee tmp/first-image-grant/voice.log
          npx pnpm@9.15.0 --filter @openscience/domain exec tsc -p tsconfig.integration.json --noEmit
          npx pnpm@9.15.0 exec eslint packages/domain/test/agent/voice-postgres.integration.test.ts
      - name: Preserve real PostgreSQL regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-image-grant-postgres
          path: tmp/first-image-grant/
          if-no-files-found: ignore
          retention-days: 7

  # Original source fixtures run without cross-parent proof/cache transport.
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PLAYWRIGHT_WEB_MODE: production
      API_ORIGIN: http://127.0.0.1:3101
      ENABLE_VISUAL_HARNESS: '1'
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x,linux-musl
      TOOLING_GROUP: ${{ matrix.group }}
      ROLLBACK_REF: ${{ inputs.rollback_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter @openscience/search generate
      - run: npx pnpm@9.15.0 --filter "@openscience/agent-worker^..." build
      - name: Verify generated Prisma clients include the required musl engines
        run: |
          core_prisma_root="$(node -e "const path = require('node:path'); const root = path.dirname(require.resolve('@prisma/client/package.json')); process.stdout.write(path.join(root, '..', '..', '.prisma', 'client'))")"
          test -f "$core_prisma_root/libquery_engine-linux-musl.so.node"
          test -f packages/search/generated/client/libquery_engine-linux-musl.so.node
      - name: Retain exact original historical source fixtures
        run: |
          for fixture_ref in ae6cb77e45ffc3e8f1ab0e93af2008898088ae5e ca0a5b1ce6b7228e04d0212a8a96b07d8adbf4a6 36e8ce5228bc8d3109de171cc86f17eab3fe7f64 e75f2764ded1074f4d307d34dca833517f0d3696 3a93eb49137a67b2c12ef0ca89d7327c68c8e1b5 70e81398903db9cfd6f46cbab51db18ba5f7cb05 1c88ff813db128fd1933096a2f102c1c1c667b25 39fcaa4b957dc5a672ae7c485b6310e3f1e6aa0d 4cc78008f86da811aeb695b5d3639a5b52891d57 ba276d8edccf163a8fb4e5a44655dd8ccf718eff 764020c76b25af571e8b88e80338406d70bdb37a 2ad0aa1b103797dd9f86a005ff3c33050b33ff54 852c6eaef9df6acbded36ff8194ff4e8392e65ea 5979840b31d6aa02e5350b0e63c8c2c8b049b133 676650c78313ac8cfe39eaf029a6eeebe71824de a9ff2332ff1b8646467edfa09628f625d6c27a1c; do
            if ! git cat-file -e "${fixture_ref}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$fixture_ref"
            fi
            test "$(git rev-parse "$fixture_ref^{commit}")" = "$fixture_ref"
          done
      - name: Run complete source tooling in fresh original test processes
        run: |
          set -euo pipefail
          mkdir -p tmp/release-tooling "tmp/release-tooling-${TOOLING_GROUP}"
          cat > tmp/release-tooling/runner.mjs <<'XGS_TOOLING_RUNNER_MJS'
          import assert from 'node:assert/strict';
          import { createReadStream, createWriteStream } from 'node:fs';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { createInterface } from 'node:readline';
          import { createRequire } from 'node:module';
          import { spawn } from 'node:child_process';
          import { finished } from 'node:stream/promises';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          import { resolve, join } from 'node:path';
          import { getHeapStatistics } from 'node:v8';

          export function registrations(ts, text) {
            const source = ts.createSourceFile('deploy.test.mjs', text, ts.ScriptTarget.Latest, true, ts.ScriptKind.JS);
            assert.equal(source.parseDiagnostics.length, 0, 'registration syntax');
            const imports = source.statements.filter(s => ts.isImportDeclaration(s) && s.moduleSpecifier.text === 'node:test');
            assert.equal(imports.length, 1); assert.equal(imports[0].importClause?.name?.text, 'test');
            assert.equal(imports[0].importClause.namedBindings, undefined, 'original default test binding only');
            // Keep acquisition of registrars closed, not merely their original spelling.
            // Additional loaders/escapes refuse; ordinary literal helper imports remain.
            const unknown = () => { throw Error('REGISTRATION_ACQUISITION_UNKNOWN'); };
            const factories = new Map(), factoryCalls = new Set(), loaderDeclarations = new Set(), loaders = new Set();
            const propertyName = n => (ts.isPropertyAccessExpression(n.parent) && n.parent.name === n)
              || ((ts.isMethodDeclaration(n.parent) || ts.isPropertyAssignment(n.parent)) && n.parent.name === n);
            const literalMember = n => ts.isPropertyAccessExpression(n) ? n.name.text
              : ts.isElementAccessExpression(n) && n.argumentExpression
                && (ts.isStringLiteral(n.argumentExpression) || ts.isNoSubstitutionTemplateLiteral(n.argumentExpression))
                  ? n.argumentExpression.text : undefined;
            const hostNamespace = n => ts.isIdentifier(n) && ['globalThis', 'global'].includes(n.text);
            const processSource = n => ts.isIdentifier(n) && n.text === 'process'
              || ((ts.isPropertyAccessExpression(n) || ts.isElementAccessExpression(n))
                && hostNamespace(n.expression) && literalMember(n) === 'process');
            function moduleArgument(call) {
              const arg = call.arguments[0];
              if (call.arguments.length !== 1 || !arg || !(ts.isStringLiteral(arg) || ts.isNoSubstitutionTemplateLiteral(arg))
                || ['node:test', 'node:module', 'module', 'node:process', 'process'].includes(arg.text)) unknown();
            }
            const walk = (node, visit) => { visit(node); ts.forEachChild(node, n => walk(n, visit)); };
            for (const statement of source.statements) {
              if (ts.isImportDeclaration(statement) && ['node:process', 'process'].includes(statement.moduleSpecifier.text)) unknown();
              if (ts.isImportDeclaration(statement) && ['node:module', 'module'].includes(statement.moduleSpecifier.text)) {
                const clause = statement.importClause;
                if (!clause || clause.name || !clause.namedBindings || !ts.isNamedImports(clause.namedBindings)) unknown();
