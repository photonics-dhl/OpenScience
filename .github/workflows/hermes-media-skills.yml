            const arrays = new Map(), calls = new Set(), names = [];
            for (const s of source.statements) if (ts.isVariableStatement(s)) for (const d of s.declarationList.declarations) {
              if (ts.isIdentifier(d.name) && d.initializer && ts.isArrayLiteralExpression(d.initializer)) {
                assert.ok(s.declarationList.flags & ts.NodeFlags.Const); assert.ok(!arrays.has(d.name.text));
