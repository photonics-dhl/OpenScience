jobs:
  first-image-grant:
    name: First image grant / real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: image_grant_test
          POSTGRES_PASSWORD: image_grant_ci
          POSTGRES_DB: image_grant_test
        ports: ['127.0.0.1:55440:5432']
        options: >-
          --health-cmd "pg_isready -U image_grant_test -d image_grant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://image_grant_test:image_grant_ci@127.0.0.1:55440/image_grant_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter '@openscience/database^...' build
      - name: Prove the first-image regression against the previous constraint
        shell: bash
        run: |
          mkdir -p tmp/first-image-grant
          candidate=infra/migrations/20261014010000_first_image_generation_grant/migration.sql
          cp "$candidate" tmp/first-image-grant/candidate.sql
          trap 'cp tmp/first-image-grant/candidate.sql "$candidate"' EXIT
          cp infra/migrations/20260922030000_visual_narrative_dynamic_render_repair/migration.sql "$candidate"
          set +e
          npx pnpm@9.15.0 --filter @openscience/database exec vitest run --config vitest.integration.config.ts test/first-image-grant-migration.integration.test.ts -t 'reproduces the old first-image rejection' > tmp/first-image-grant/red.log 2>&1
          red_status=$?
          set -e
          cat tmp/first-image-grant/red.log
          test "$red_status" -ne 0
          # Vitest prefixes stderr with ANSI SGR resets even when redirected.
          # Strip formatting only; still require the exact observed-error marker.
          sed -E 's/\x1B\[[0-9;]*m//g' tmp/first-image-grant/red.log | grep -Fxq 'FIRST_IMAGE_GRANT_OLD_CHECK_REJECTED_TWO_TASK_RUN'
      - name: Verify exact grants, invalid values and safe rollback
        shell: bash
        run: |
          set -o pipefail
          npx pnpm@9.15.0 --filter @openscience/database exec vitest run --config vitest.integration.config.ts test/first-image-grant-migration.integration.test.ts | tee tmp/first-image-grant/green.log
      - name: Lint the migration regression test
        run: npx pnpm@9.15.0 exec eslint packages/database/test/first-image-grant-migration.integration.test.ts
      - name: Build and verify voice on the real test database
        shell: bash
        env:
          NODE_ENV: test
        run: |
          set -o pipefail
          node <<'NODE'
          if (process.env.NODE_ENV !== 'test' || !process.env.DATABASE_URL?.trim()) throw new Error('Explicit test database environment required');
          let url;
          try { url = new URL(process.env.DATABASE_URL); } catch { throw new Error('Invalid test database target'); }
          if (!['postgresql:', 'postgres:'].includes(url.protocol) || url.hostname !== '127.0.0.1'
            || url.port !== '55440' || url.pathname !== '/image_grant_test' || url.hash) throw new Error('Unapproved test database target');
          if ([...url.searchParams.keys()].some(key => key !== 'connection_limit')) throw new Error('Unapproved test database options');
          NODE
          npx pnpm@9.15.0 --filter '@openscience/domain...' build
          npx pnpm@9.15.0 --filter @openscience/database build
          node packages/database/dist/migrate-cli.js deploy
          npx pnpm@9.15.0 --filter @openscience/domain exec vitest run --config vitest.integration.config.ts test/agent/voice-postgres.integration.test.ts | tee tmp/first-image-grant/voice.log
          npx pnpm@9.15.0 --filter @openscience/domain exec tsc -p tsconfig.integration.json --noEmit
          npx pnpm@9.15.0 exec eslint packages/domain/test/agent/voice-postgres.integration.test.ts
      - name: Preserve real PostgreSQL regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-image-grant-postgres
          path: tmp/first-image-grant/
          if-no-files-found: ignore
          retention-days: 7

  skill-path:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:16379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      PLAYWRIGHT_WEB_MODE: production
      API_ORIGIN: http://127.0.0.1:3101
      ENABLE_VISUAL_HARNESS: '1'
      # Match the locked schemas' native + linux-musl targets so rollback
      # verification compares generated bytes with the real Prisma vendor.
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x,linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter @openscience/search generate
      - run: npx pnpm@9.15.0 --filter "@openscience/agent-worker^..." build
      - name: Verify generated Prisma clients include the required musl engines
        run: |
          core_prisma_root="$(node -e "const path = require('node:path'); const root = path.dirname(require.resolve('@prisma/client/package.json')); process.stdout.write(path.join(root, '..', '..', '.prisma', 'client'))")"
          test -f "$core_prisma_root/libquery_engine-linux-musl.so.node"
          test -f packages/search/generated/client/libquery_engine-linux-musl.so.node
      - name: Verify rollback readers against the complete installed release
        run: |
          node --input-type=module -e "import { verifyApplicationRollbackReaders } from './infra/scripts/production-deploy-lock.mjs'; await verifyApplicationRollbackReaders({ candidateRoot: process.env.GITHUB_WORKSPACE, rollbackRoot: process.env.GITHUB_WORKSPACE, diagnostics: true });"
      - name: Verify rollback readers against the requested exact release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_ref != '' }}
        shell: bash
        env:
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          [[ "$ROLLBACK_REF" =~ ^[0-9a-f]{40}$ ]] || exit 64
          git fetch --no-tags --depth=1 origin "$ROLLBACK_REF"
          test "$(git rev-parse "$ROLLBACK_REF^{commit}")" = "$ROLLBACK_REF"
          rollback_root="$RUNNER_TEMP/r04-rollback-$ROLLBACK_REF"
          mkdir "$rollback_root"
          git archive "$ROLLBACK_REF" | tar -x -C "$rollback_root"
          (
            cd "$rollback_root"
            npx pnpm@9.15.0 install --frozen-lockfile
            npx pnpm@9.15.0 --filter @openscience/database generate
            npx pnpm@9.15.0 --filter @openscience/search generate
            npx pnpm@9.15.0 --filter "@openscience/agent-worker^..." build
          )
          ROLLBACK_ROOT="$rollback_root" node --input-type=module -e "import { verifyApplicationRollbackReaders } from './infra/scripts/production-deploy-lock.mjs'; console.log('R04_PAIR', process.env.GITHUB_SHA, process.env.ROLLBACK_REF); await verifyApplicationRollbackReaders({ candidateRoot: process.env.GITHUB_WORKSPACE, rollbackRoot: process.env.ROLLBACK_ROOT, diagnostics: true });"
      - name: Storyboard selection lifecycle and media retention
        run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test presentation-media-retention.spec.ts --config playwright.config.ts --workers 1 --output ../../tmp/storyboard-lifecycle-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
          WEB_BASE_URL: http://127.0.0.1:3037
      - name: Verify Synclip voice contracts and the private task path
        run: |
          npx pnpm@9.15.0 --filter @openscience/ai-gateway exec vitest run test/synclip-audio-api.test.ts test/synclip-asr-api.test.ts test/synclip-voice.test.ts
          npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/voice.test.ts
          npx pnpm@9.15.0 --filter @openscience/agent-worker build
          npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/voice.test.ts
          npx pnpm@9.15.0 --filter @openscience/api exec vitest run test/voice-routes.test.ts test/voice-dialogue-flow.test.ts
          npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/hermes-voice-api.test.ts test/hermes-voice-recorder.test.ts
      - name: Lint voice sources and regressions
