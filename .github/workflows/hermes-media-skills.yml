      - run: python3 -m unittest discover -s infra/hermes-agent -p "test_*.py"
      - run: sudo python3 -m unittest discover -s infra/hermes-agent -p test_host_broker.py
      - run: sudo python3 -m unittest discover -s infra/hermes-agent -p test_install_lifecycle.py
      - run: node --check infra/hermes-agent/offline_host.cjs
      - run: node --test infra/scripts/deploy.test.mjs scripts/release-input-manifest.test.mjs
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/native-agent-session.test.ts test/native-paper-tools.test.ts test/native-host-task.test.ts test/native-task-store.test.ts test/native-science-materialization.test.ts test/native-source-review-task.test.ts test/queue-recovery.test.ts test/native-illustration-task.test.ts test/native-illustration-skill-replay.test.ts test/native-video-planning.test.ts test/presentation/native-illustration-generation.test.ts test/presentation/native-illustration-materializer.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/native-agent-execution.test.ts test/agent/native-video-research-run.test.ts test/agent/hermes-run-intent-query.test.ts test/assets/native-video-storyboard.test.ts test/assets/native-video-parents.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker typecheck
      - name: Video readiness before paid source and media work
        run: |
          npx pnpm@9.15.0 --filter @openscience/ai-gateway exec vitest run test/synclip-video-readiness.test.ts
          npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/video-readiness.test.ts
          npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t 'while (video is )?closed'
          npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/video-task-admission.test.ts test/native-video-readiness.test.ts
          node --test infra/compose/docker-compose.prod.test.mjs
      - name: Source-preserving long table indexing
        run: |
          npx pnpm@9.15.0 --filter @openscience/search exec vitest run test/chunker.test.ts test/embedder.test.ts
          npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/search-indexer.test.ts
      - name: Source-index recovery and dispatch acknowledgements
        run: |
          node --test scripts/index-confirmed-research-sources.test.cjs
          npx pnpm@9.15.0 --filter @openscience/search exec vitest run test/indexing-storage.test.ts
          npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t 'source-index|snapshot dispatch|retries one failed task|uses one authority'
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/cascade-orchestrator.test.ts test/parser-recovery-checkpoint.test.ts test/parser-recovery-handler.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/source-parser-recovery.test.ts test/agent/direct-source-review-recovery.test.ts test/agent/saved-source-review-recovery.test.ts test/agent/independent-source-review.test.ts test/agent/source-review-not-submitted.test.ts test/agent/hermes-source-model-routing.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/private-source-reanalysis.test.ts test/agent/source-composition-recovery.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/api exec vitest run test/source-parser-recovery.test.ts test/research-runs.test.ts test/direct-source-review-recovery.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/api exec vitest run test/native-source-correction.test.ts test/private-source-reanalysis.test.ts test/source-composition-recovery.test.ts test/entrypoint-startup.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/api typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/api exec vitest run test/security/rate-limit.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/gateway-config.test.ts test/native-image-review-routing.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/skills/handdraw-routing.test.ts test/presentation/automatic-style.test.ts test/presentation/scientific-comparison.test.ts test/presentation/style-recommendations.test.ts test/presentation/selected-scene-art.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/style-recommendations.test.ts test/agent/art-style-continuation.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/extractor.test.ts -t "disclosure guidance"
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/source-review-output.test.ts test/saved-source-review-handler.test.ts test/native-source-pages.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/native-source-correction.test.ts test/agent/native-source-review.test.ts test/agent/native-independent-source-review.test.ts test/agent/native-agent-execution.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/visual-source-context.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/private-science-diagnostics.test.ts test/agent/storyboard-science-recovery.test.ts test/agent/standalone-science-recovery.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/ingestion-parser.test.ts -t "Docling table normalization"
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/workspace-guide.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/presentation/generated-image-review.test.ts test/presentation/native-image-review.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/native-image-review.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/ai-gateway exec vitest run test/native-image-review.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "blocks unreviewed narrative image approval while preserving rejection and legacy profiles"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/trash/content-list.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "reports private media retention authority"
      - run: node --test infra/scripts/cloudflared-resilience.test.mjs
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "starts one charged review-only task"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "recovers a saved manual PNG only|local budget|local-budget"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "replaces one failed review-only request"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "rearms only a receipted manual PNG review"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "preserves diagnostics during bounded native review recovery|keeps malformed native review checkpoints readable"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "prevents retrying a failed image source"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "current platform admin can submit"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/ingestion-service.test.ts -t "auto-funds a current platform admin"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/ingestion-service.test.ts -t "review-only preflight recovery"
      - run: node --check infra/codex-sol-review/runner.mjs
      - run: node --check infra/chatgpt-browser/review-broker.mjs
      - run: node --check infra/chatgpt-browser/runner.cjs
      - run: node --check infra/chatgpt-browser/review-runner.cjs
      - run: node --test infra/chatgpt-browser/review-runner-selector.test.cjs
      - run: node --check infra/codex-sol-review/review-client.mjs
      - run: bash -n infra/codex-sol-review/install.sh
      - run: npx pnpm@9.15.0 --filter @openscience/web typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/web build
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/presentation-result-gallery.test.tsx test/storyboard-panel.test.tsx test/presentation-storyboard-selection.test.tsx
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/start-paper-narrative.test.ts test/media-asset-actions.test.tsx test/hermes-research-run-source-status.test.tsx test/hermes-video-draft.test.ts test/hermes-video-action.test.tsx test/hermes-video-run-panel.test.tsx test/hermes-research-run-panel.test.tsx test/hermes-viewer-session.test.tsx test/hermes-presentation-action.test.ts test/api-agent.test.ts
      - name: Hermes surface lifetime and dashboard behavior
        run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/hermes-stage-portal.test.ts test/hermes-companion-surface.test.ts test/hermes-global-companion.test.tsx test/research-guide-data.test.tsx test/auth-dashboard.test.tsx
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/hermes-source-reanalysis-api.test.ts test/hermes-source-reanalysis-intent.test.ts test/hermes-source-reanalysis-panel.test.tsx
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/illustration-style-switch.test.ts test/illustration-style-choices.test.tsx test/illustration-style-api.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/managed-illustration-style.test.ts test/managed-illustration-style-api.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test create-illustrated-research.spec.ts managed-illustration-style.spec.ts hermes-source-parsing.spec.ts researcher-services.spec.ts --config playwright.config.ts --workers 1 --output ../../tmp/illustrated-creation-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: Guide layout and contextual companion focus
        run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test vendor-ux.spec.ts --grep "guide scenes support keyboard|English guide keeps task tabs|guide remains usable when the public preview fails" --config playwright.config.ts --workers 1 --max-failures=1 --reporter=line --trace=retain-on-failure --output ../../tmp/hermes-guide-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/presentation-media-retention.test.tsx test/existing-scene-image-review.test.tsx
      - name: Storyboard selection lifecycle and media retention
        run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test presentation-media-retention.spec.ts --config playwright.config.ts --workers 1 --output ../../tmp/storyboard-lifecycle-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
          WEB_BASE_URL: http://127.0.0.1:3037
      - run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test presentation-workbench.spec.ts --grep "saved science retry|saved PNG review-only|rejected scene image remains" --config playwright.config.ts --workers 1 --output ../../tmp/presentation-retry-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/ingestion-review-polling.test.ts test/api-client-contract.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/surface-shells.test.tsx -t "review-only preflight recovery"
      - run: npx pnpm@9.15.0 docs:lint
      - name: Preserve synthetic browser failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-browser-failure-evidence
          path: |
            tmp/illustrated-creation-browser/
            tmp/hermes-entry-browser/
            tmp/hermes-guide-browser/
            tmp/storyboard-lifecycle-browser/
            tmp/presentation-retry-browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve synthetic page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-page-screenshots
          path: |
            apps/web/test/visual/out/**/*.png
            apps/web/test/visual/out/**/*.json
          if-no-files-found: ignore
          retention-days: 7

  # Keep complete navigation acceptance in isolated runners with per-case logs.
  browser-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_WEB_MODE: production
      API_ORIGIN: http://127.0.0.1:3101
      ENABLE_VISUAL_HARNESS: '1'
    strategy:
      fail-fast: false
      matrix:
        suite: [hermes-workspace-stage, hermes-dashboard, auth-dashboard, research-continuation]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter '@openscience/web...' build
      - name: Hermes navigation and existing research entry
        run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test '${{ matrix.suite }}.spec.ts' --config playwright.config.ts --workers 1 --reporter=line --trace retain-on-failure --output ../../tmp/hermes-entry-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: Preserve isolated browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
