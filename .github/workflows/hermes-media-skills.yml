                const parent = n.parent;
                if (ts.isVariableDeclaration(parent) && parent.name === n && loaderDeclarations.has(parent)) return;
                if (ts.isCallExpression(parent) && parent.expression === n) { moduleArgument(parent); return; }
                if ((ts.isPropertyAccessExpression(parent) || ts.isElementAccessExpression(parent))
