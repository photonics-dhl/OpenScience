              const call = n.expression;
              assert.ok(ts.isIdentifier(call.expression) && call.expression.text === 'test', 'original test import required');
              assert.equal(call.arguments.length, 2, 'no altered test options');
              assert.ok(ts.isArrowFunction(call.arguments[1]) || ts.isFunctionExpression(call.arguments[1]));
              const name = value(call.arguments[0], env); assert.equal(typeof name, 'string'); assert.ok(name.length);
