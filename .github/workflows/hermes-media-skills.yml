            });
            walk(source, n => {
              if (!ts.isIdentifier(n) || propertyName(n)) return;
              if (factories.has(n.text)) {
                const declaration = factories.get(n.text);
                if (n.parent === declaration || (ts.isCallExpression(n.parent) && n.parent.expression === n && factoryCalls.has(n.parent))) return;
