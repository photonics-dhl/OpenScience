                    binding.elements.forEach((b, i) => {
                      assert.ok(ts.isBindingElement(b) && ts.isIdentifier(b.name) && !b.initializer && !b.dotDotDotToken);
                      assert.notEqual(b.name.text, 'test'); assert.ok(element.elements[i]); env.set(b.name.text, element.elements[i]);
