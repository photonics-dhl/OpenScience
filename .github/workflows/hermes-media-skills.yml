            finish_observer "$err_pid" "$err_start" stderr
            exit "$original_rc"
          }
          trap finish_observers EXIT
          trap 'printf "{\"event\":\"wrapper-signal\",\"signal\":2}\n" >> "$trace/command.ndjson" || true; exit 130' INT
          trap 'printf "{\"event\":\"wrapper-signal\",\"signal\":15}\n" >> "$trace/command.ndjson" || true; exit 143' TERM
          set +e
          if ! exec {out_fd}> >(tee --output-error=warn "$trace/stdout.log"); then
            node --test infra/scripts/deploy.test.mjs scripts/release-input-manifest.test.mjs infra/scripts/production-release-retention.test.mjs
            exit "$?"
          fi
          out_pid=$!
          out_start=$(observer_start "$out_pid") || true
          if ! exec {err_fd}> >(tee --output-error=warn "$trace/stderr.log" >&2); then
            exec {out_fd}>&-
            node --test infra/scripts/deploy.test.mjs scripts/release-input-manifest.test.mjs infra/scripts/production-release-retention.test.mjs
            exit "$?"
          fi
          err_pid=$!
          err_start=$(observer_start "$err_pid") || true
          printf '{"event":"command-begin","unixSeconds":%s}\n' "$(date +%s)" > "$trace/command.ndjson" || true
          XGS_VIDEO_TIMEOUT_TRACE="$trace/phase.ndjson" node --test infra/scripts/deploy.test.mjs scripts/release-input-manifest.test.mjs infra/scripts/production-release-retention.test.mjs >&$out_fd 2>&$err_fd &
          test_pid=$!
          exec {out_fd}>&- {err_fd}>&-
          python3 -u "$trace/sample.py" "$test_pid" "$trace/process.ndjson" 2> "$trace/sampler.stderr" &
          monitor_pid=$!
          monitor_start=$(observer_start "$monitor_pid") || true
          wait "$test_pid"
          test_rc=$?
          printf '{"event":"command-exit","unixSeconds":%s,"pid":%s,"exit":%s}\n' "$(date +%s)" "$test_pid" "$test_rc" >> "$trace/command.ndjson" || true
          exit "$test_rc"
