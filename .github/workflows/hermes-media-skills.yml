              }
              if (ts.isBindingElement(n) && n.propertyName && n.propertyName.text === 'getBuiltinModule') unknown();
              if ((ts.isImportDeclaration(n) || ts.isExportDeclaration(n)) && n !== imports[0]
                && n.moduleSpecifier && ['node:test', 'node:module', 'module', 'node:process', 'process'].includes(n.moduleSpecifier.text)
                && !ts.isImportDeclaration(n)) unknown();
