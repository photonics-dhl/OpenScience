jobs:
  skill-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter "@openscience/agent-worker^..." build
      - run: npx pnpm@9.15.0 --filter @openscience/ai-gateway exec vitest run test/codex-sol-review-protocol.test.ts test/codex-sol-review.test.ts test/image-review-routing.test.ts test/web-image-review-model.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/api typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/api exec vitest run test/security/rate-limit.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/gateway-config.test.ts -t "boots with the global AI switch off"
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/skills/handdraw-routing.test.ts test/presentation/automatic-style.test.ts test/presentation/scientific-comparison.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/extractor.test.ts -t "disclosure guidance"
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/visual-source-context.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/private-science-diagnostics.test.ts test/agent/storyboard-science-recovery.test.ts test/agent/standalone-science-recovery.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/ingestion-parser.test.ts -t "Docling table normalization"
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/workspace-guide.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/presentation/generated-image-review.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "blocks unreviewed narrative image approval while preserving rejection and legacy profiles"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/trash/content-list.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "reports private media retention authority"
      - run: node --test infra/scripts/cloudflared-resilience.test.mjs
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "starts one charged review-only task"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "recovers a saved manual PNG only|local budget|local-budget"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "replaces one failed review-only request"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "rearms only a receipted manual PNG review"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "prevents retrying a failed image source"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "current platform admin can submit"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/ingestion-service.test.ts -t "auto-funds a current platform admin"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/ingestion-service.test.ts -t "review-only preflight recovery"
      - run: node --check infra/codex-sol-review/runner.mjs
      - run: node --check infra/chatgpt-browser/review-broker.mjs
      - run: node --check infra/chatgpt-browser/runner.cjs
      - run: node --check infra/chatgpt-browser/review-runner.cjs
      - run: node --check infra/codex-sol-review/review-client.mjs
      - run: bash -n infra/codex-sol-review/install.sh
      - run: npx pnpm@9.15.0 --filter @openscience/web typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/web build
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/presentation-result-gallery.test.tsx test/storyboard-panel.test.tsx
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/presentation-media-retention.test.tsx
      - run: npx pnpm@9.15.0 --filter @openscience/web exec playwright test presentation-workbench.spec.ts --grep "saved science retry" --config playwright.config.ts --workers 1 --output ../../tmp/presentation-retry-browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/ingestion-review-polling.test.ts test/api-client-contract.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/surface-shells.test.tsx -t "review-only preflight recovery"
      - run: npx pnpm@9.15.0 docs:lint
