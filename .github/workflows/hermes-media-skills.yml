                    if (!(n.parent.parent.flags & ts.NodeFlags.Const)) unknown();
                    loaderDeclarations.add(n.parent); loaders.add(n.parent.name.text);
                  } else if (ts.isCallExpression(n.parent) && n.parent.expression === n) moduleArgument(n.parent);
                  else unknown();
                }
                const callee = n.expression;
                if ((ts.isIdentifier(callee) && callee.text === 'require')
                  || ['require', 'getBuiltinModule'].includes(literalMember(callee))) moduleArgument(n);
