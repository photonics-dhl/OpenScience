name: Hermes media pipeline

# The existing CI runs only on main. Check the release branch's media skills
# and pixel-review approval path without invoking unrelated monorepo suites.
on:
  workflow_dispatch:
  push:
    branches: [release/onchip-production-line]
    paths:
      - '.agents/skills/openscience-handdraw-*/**'
      - '.agents/skills/openscience-scientific-visual-clarity/**'
      - 'apps/agent-worker/src/skills/installed-media-skills.ts'
      - 'apps/agent-worker/test/skills/handdraw-routing.test.ts'
      - 'apps/agent-worker/src/presentation/generated-image-review.ts'
      - 'apps/agent-worker/src/presentation/scene-image.ts'
      - 'apps/agent-worker/src/index.ts'
      - 'apps/agent-worker/test/gateway-config.test.ts'
      - 'apps/api/src/routes/presentation-assets.ts'
      - 'infra/codex-sol-review/**'
      - 'infra/chatgpt-browser/review-broker.mjs'
      - 'infra/chatgpt-browser/review-runner.cjs'
      - 'infra/codex-image-runner/proxy.mjs'
      - 'infra/compose/docker-compose.prod.yml'
      - 'packages/ai-gateway/src/codex-sol-review*.ts'
      - 'packages/ai-gateway/src/gateway.ts'
      - 'packages/ai-gateway/src/science-review*.ts'
      - 'packages/ai-gateway/test/codex-sol-review*.test.ts'
      - 'packages/ai-gateway/test/image-review-routing.test.ts'
      - 'packages/ai-gateway/test/web-image-review-model.test.ts'
      - 'apps/agent-worker/src/presentation/handler.ts'
      - 'apps/agent-worker/test/presentation/generated-image-review.test.ts'
      - 'apps/web/components/hermes/HermesMediaReview.tsx'
      - 'apps/web/components/presentation/PresentationResultGallery.tsx'
      - 'apps/web/lib/api.ts'
      - 'apps/web/test/presentation-result-gallery.test.tsx'
      - 'packages/domain/src/assets/scene-image.ts'
      - 'packages/domain/src/assets/presentation-asset.ts'
      - 'packages/domain/src/agent/agent.ts'
      - 'packages/domain/src/ingestion/ingestion-service.ts'
      - 'packages/domain/src/index.ts'
      - 'packages/domain/test/assets/presentation-asset.test.ts'
      - 'packages/domain/test/agent/agent.test.ts'
      - 'packages/domain/test/ingestion-service.test.ts'
      - 'packages/domain/test/helpers/fakes.ts'
      - '.github/workflows/hermes-media-skills.yml'
  pull_request:
    branches: [release/onchip-production-line]
    paths:
      - '.agents/skills/openscience-handdraw-*/**'
      - '.agents/skills/openscience-scientific-visual-clarity/**'
      - 'apps/agent-worker/src/skills/installed-media-skills.ts'
      - 'apps/agent-worker/test/skills/handdraw-routing.test.ts'
      - 'apps/agent-worker/src/presentation/generated-image-review.ts'
      - 'apps/agent-worker/src/presentation/scene-image.ts'
      - 'apps/agent-worker/src/index.ts'
      - 'apps/agent-worker/test/gateway-config.test.ts'
      - 'apps/api/src/routes/presentation-assets.ts'
      - 'infra/codex-sol-review/**'
      - 'infra/chatgpt-browser/review-broker.mjs'
      - 'infra/chatgpt-browser/review-runner.cjs'
      - 'infra/codex-image-runner/proxy.mjs'
      - 'infra/compose/docker-compose.prod.yml'
      - 'packages/ai-gateway/src/codex-sol-review*.ts'
      - 'packages/ai-gateway/src/gateway.ts'
      - 'packages/ai-gateway/src/science-review*.ts'
      - 'packages/ai-gateway/test/codex-sol-review*.test.ts'
      - 'packages/ai-gateway/test/image-review-routing.test.ts'
      - 'packages/ai-gateway/test/web-image-review-model.test.ts'
      - 'apps/agent-worker/src/presentation/handler.ts'
      - 'apps/agent-worker/test/presentation/generated-image-review.test.ts'
      - 'apps/web/components/hermes/HermesMediaReview.tsx'
      - 'apps/web/components/presentation/PresentationResultGallery.tsx'
      - 'apps/web/lib/api.ts'
      - 'apps/web/test/presentation-result-gallery.test.tsx'
      - 'packages/domain/src/assets/scene-image.ts'
      - 'packages/domain/src/assets/presentation-asset.ts'
      - 'packages/domain/src/agent/agent.ts'
      - 'packages/domain/src/ingestion/ingestion-service.ts'
      - 'packages/domain/src/index.ts'
      - 'packages/domain/test/assets/presentation-asset.test.ts'
      - 'packages/domain/test/agent/agent.test.ts'
      - 'packages/domain/test/ingestion-service.test.ts'
      - 'packages/domain/test/helpers/fakes.ts'
      - '.github/workflows/hermes-media-skills.yml'

jobs:
  skill-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter "@openscience/agent-worker^..." build
      - run: npx pnpm@9.15.0 --filter @openscience/ai-gateway exec vitest run test/codex-sol-review-protocol.test.ts test/codex-sol-review.test.ts test/image-review-routing.test.ts test/web-image-review-model.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/api typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/gateway-config.test.ts -t "boots with the global AI switch off"
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/skills/handdraw-routing.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/presentation/generated-image-review.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "blocks unreviewed narrative image approval while preserving rejection and legacy profiles"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "starts one charged review-only task"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/assets/presentation-asset.test.ts -t "recovers a saved manual PNG only"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "rearms only a receipted manual PNG review"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "prevents retrying a failed image source"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/agent/agent.test.ts -t "current platform admin can submit"
      - run: npx pnpm@9.15.0 --filter @openscience/domain exec vitest run test/ingestion-service.test.ts -t "auto-funds a current platform admin"
      - run: node --check infra/codex-sol-review/runner.mjs
      - run: node --check infra/chatgpt-browser/review-broker.mjs
      - run: node --check infra/chatgpt-browser/review-runner.cjs
      - run: node --check infra/codex-sol-review/review-client.mjs
      - run: bash -n infra/codex-sol-review/install.sh
      - run: npx pnpm@9.15.0 --filter @openscience/web typecheck
      - run: npx pnpm@9.15.0 --filter @openscience/web exec vitest run test/presentation-result-gallery.test.tsx
      - run: npx pnpm@9.15.0 docs:lint
