            failCleanup:true,cleanupFailure:true,spawnError:true,reporterError:true,outputFailure:true,missingVerdict:true,abortRefused:true,
            linuxProcessGroupVerified:process.platform!=='win32',productionTestsExecuted:0})+'\n');
          console.log('TOOLING_CONTROLS_PASS '+base);
          XGS_TOOLING_CONTROLS_MJS
          export TOOLING_CONTROL_DIRECTORY="tmp/release-tooling-${TOOLING_GROUP}/control-"
          node tmp/release-tooling/controls.mjs
          node tmp/release-tooling/runner.mjs
      - name: Preserve complete tooling verdicts and original child output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tooling-${{ matrix.group }}
          path: |
            tmp/release-tooling-${{ matrix.group }}/
            tmp/release-tooling/
          if-no-files-found: error
          retention-days: 7

  skill-path:
    needs: release-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:16379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      PLAYWRIGHT_WEB_MODE: production
      API_ORIGIN: http://127.0.0.1:3101
      ENABLE_VISUAL_HARNESS: '1'
      # Match the locked schemas' native + linux-musl targets so rollback
      # verification compares generated bytes with the real Prisma vendor.
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x,linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter @openscience/search generate
      - run: npx pnpm@9.15.0 --filter "@openscience/agent-worker^..." build
      - name: Verify generated Prisma clients include the required musl engines
        run: |
          core_prisma_root="$(node -e "const path = require('node:path'); const root = path.dirname(require.resolve('@prisma/client/package.json')); process.stdout.write(path.join(root, '..', '..', '.prisma', 'client'))")"
          test -f "$core_prisma_root/libquery_engine-linux-musl.so.node"
          test -f packages/search/generated/client/libquery_engine-linux-musl.so.node
      - name: Verify rollback readers against the complete installed release
        run: |
          node --input-type=module -e "import { verifyApplicationRollbackReaders } from './infra/scripts/production-deploy-lock.mjs'; await verifyApplicationRollbackReaders({ candidateRoot: process.env.GITHUB_WORKSPACE, rollbackRoot: process.env.GITHUB_WORKSPACE, diagnostics: true });"
      - name: Verify rollback readers against the requested exact release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_ref != '' }}
        shell: bash
        env:
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          [[ "$ROLLBACK_REF" =~ ^[0-9a-f]{40}$ ]] || exit 64
          git fetch --no-tags --depth=1 origin "$ROLLBACK_REF"
          test "$(git rev-parse "$ROLLBACK_REF^{commit}")" = "$ROLLBACK_REF"
          rollback_root="$RUNNER_TEMP/r04-rollback-$ROLLBACK_REF"
          mkdir "$rollback_root"
          git archive "$ROLLBACK_REF" | tar -x -C "$rollback_root"
          (
            cd "$rollback_root"
            npx pnpm@9.15.0 install --frozen-lockfile
            npx pnpm@9.15.0 --filter @openscience/database generate
            npx pnpm@9.15.0 --filter @openscience/search generate
            npx pnpm@9.15.0 --filter "@openscience/agent-worker^..." build
          )
          ROLLBACK_ROOT="$rollback_root" node --input-type=module -e "import { verifyApplicationRollbackReaders } from './infra/scripts/production-deploy-lock.mjs'; console.log('R04_PAIR', process.env.GITHUB_SHA, process.env.ROLLBACK_REF); await verifyApplicationRollbackReaders({ candidateRoot: process.env.GITHUB_WORKSPACE, rollbackRoot: process.env.ROLLBACK_ROOT, diagnostics: true });"
