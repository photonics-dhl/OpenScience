                }
              }
            }
            walk(source, n => {
              // Validate an identified source's whole member/escape domain BEFORE looking
              // for a particular loader name. Do not interpret computed key expressions.
              if ((processSource(n) || hostNamespace(n)) && !propertyName(n)) {
                const member = n.parent;
                if (!(ts.isPropertyAccessExpression(member) || ts.isElementAccessExpression(member))
                  || member.expression !== n || literalMember(member) === undefined) unknown();
                if (hostNamespace(n) && ['global', 'globalThis'].includes(literalMember(member))) unknown();
              }
