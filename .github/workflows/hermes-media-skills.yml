      - name: Check image host operations with their production privileges
        run: |
          mkdir -p tmp/hermes-cleanup-20261003
          sudo "$(command -v node)" --test infra/synclip-image/transport.test.mjs infra/synclip-image/broker.test.mjs infra/synclip-image/install.test.mjs
      - run: python3 -m unittest discover -s infra/synclip-image -p configure_key_test.py
