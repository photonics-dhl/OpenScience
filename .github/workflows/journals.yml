name: Journal onboarding

on:
  pull_request:
  push:
    branches: [codex/journal-onboarding, frontend/nanqing]

permissions:
  contents: read

jobs:
  journals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journal_test
          POSTGRES_PASSWORD: journal_test_ci
          POSTGRES_DB: journal_test
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U journal_test -d journal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://journal_test:journal_test_ci@127.0.0.1:55439/journal_test
      JOURNAL_TEST_DATABASE_URL: postgresql://journal_test:journal_test_ci@127.0.0.1:55439/journal_test
      SEARCH_DATABASE_URL: postgresql://journal_test:journal_test_ci@127.0.0.1:55439/journal_search_test
      NEXT_TELEMETRY_DISABLED: '1'
      API_ORIGIN: http://127.0.0.1:43141
      JOURNAL_BROWSER_API_PORT: '43141'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify draft workbench port rules and route regression
        run: node --test scripts/test-journal-workbench.mjs
      - name: Apply all core migrations to the isolated database
        run: pnpm exec prisma migrate deploy --schema infra/schema.prisma
      - name: Generate database clients before parallel consumers compile
        run: |
          pnpm exec prisma generate --schema infra/schema.prisma
          pnpm --filter @openscience/search generate
      - name: Build backend dependencies and applications
        run: pnpm --filter @openscience/api... build
      - name: Verify search storage against an isolated generation database
        env:
          SEARCH_TEST_DATABASE_URL: postgresql://journal_test:journal_test_ci@127.0.0.1:55439/openscience_search_test_ci${{ github.run_id }}a${{ github.run_attempt }}
          SEARCH_TEST_MUTATION_CONFIRM: DISPOSABLE_SEARCH_DB
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const name = new URL(process.env.SEARCH_TEST_DATABASE_URL).pathname.slice(1);
          if (!/^openscience_search_test_[a-z0-9]{8,48}$/.test(name)) throw new Error('invalid disposable search database');
          const client = new PrismaClient();
          try { await client.$executeRawUnsafe(`CREATE DATABASE "${name}"`); }
          finally { await client.$disconnect(); }
          NODE
          SEARCH_DATABASE_URL="$SEARCH_TEST_DATABASE_URL" npx pnpm@9.15.0 --filter @openscience/search migrate:deploy
          npx pnpm@9.15.0 --filter @openscience/search exec vitest run test/storage.integration.test.ts --testTimeout=20000 --no-file-parallelism
      - name: Verify source, tenancy, concurrency and immutable publication
        run: pnpm --filter @openscience/domain exec vitest run journal --testTimeout=20000 --no-file-parallelism
      - name: Verify HTTP boundary and public data contracts
        run: pnpm --filter @openscience/api exec vitest run journal test/research-routes.test.ts test/academic-profile-routes.test.ts test/academic-profile-database.test.ts --testTimeout=20000 --no-file-parallelism
      - name: Verify worker validation and retries
        run: pnpm --filter @openscience/agent-worker exec vitest run test/journal-worker.test.ts
      - name: Build web
        run: pnpm --filter @openscience/web build
      - name: Verify web contracts and controls
        run: pnpm --filter @openscience/web exec vitest run journal
      - name: Install Chromium for real API and web acceptance
        run: pnpm --filter @openscience/web exec playwright install --with-deps chromium
      - name: Verify journal desktop and mobile flows with real sessions and PostgreSQL
        run: pnpm --filter @openscience/api exec vitest run test/journal-browser.test.ts
        env:
          JOURNAL_BROWSER_TEST: '1'
      - name: Documentation consistency
        run: pnpm audit:docs-sync && pnpm docs:lint
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-browser-evidence
          path: apps/web/test/visual/out/journals/
          if-no-files-found: ignore
          retention-days: 7
