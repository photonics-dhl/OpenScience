name: Hermes video

# The release branch's media workflow does not watch these video files.
# Exercise duplicate-charge recovery and Linux filesystem durability without
# invoking unrelated image-generation, UI or production/provider workflows.
on:
  workflow_dispatch:
  push:
    branches: [release/onchip-production-line, frontend/nanqing]
    paths:
      - 'infra/codex-image-runner/video-*'
      - 'infra/codex-image-runner/minimax-video-*'
      - 'infra/codex-image-runner/core.mjs'
      - 'infra/codex-image-runner/core.test.mjs'
      - 'packages/ai-gateway/src/minimax-video*.ts'
      - 'packages/ai-gateway/src/minimax-speech.ts'
      - 'packages/ai-gateway/src/synclip-video-api.ts'
      - 'packages/ai-gateway/test/synclip-video-api.test.ts'
      - 'packages/ai-gateway/src/synclip-audio-api.ts'
      - 'packages/ai-gateway/test/synclip-audio-api.test.ts'
      - 'infra/synclip-video/**'
      - 'apps/agent-worker/src/presentation/synclip-video-spool.ts'
      - 'apps/agent-worker/test/synclip-video-spool.test.ts'
      - 'apps/agent-worker/src/presentation/handler.ts'
      - 'apps/agent-worker/src/presentation/host-video-spool.ts'
      - 'apps/agent-worker/test/presentation/video-reference-handoff.test.ts'
      - 'packages/ai-gateway/test/minimax-speech.test.ts'
      - 'apps/media-demo/**'
      - 'packages/ai-gateway/test/minimax-video*.test.ts'
      - 'packages/ai-gateway/test/fixtures/minimax-video-sample.mp4'
      - 'packages/ai-gateway/test/fixtures/minimax-reference.png'
      - '.github/workflows/hermes-video.yml'
  pull_request:
    branches: [release/onchip-production-line, frontend/nanqing]
    paths:
      - 'infra/codex-image-runner/video-*'
      - 'infra/codex-image-runner/minimax-video-*'
      - 'infra/codex-image-runner/core.mjs'
      - 'infra/codex-image-runner/core.test.mjs'
      - 'packages/ai-gateway/src/minimax-video*.ts'
      - 'packages/ai-gateway/src/minimax-speech.ts'
      - 'packages/ai-gateway/src/synclip-video-api.ts'
      - 'packages/ai-gateway/test/synclip-video-api.test.ts'
      - 'packages/ai-gateway/src/synclip-audio-api.ts'
      - 'packages/ai-gateway/test/synclip-audio-api.test.ts'
      - 'infra/synclip-video/**'
      - 'apps/agent-worker/src/presentation/synclip-video-spool.ts'
      - 'apps/agent-worker/test/synclip-video-spool.test.ts'
      - 'apps/agent-worker/src/presentation/handler.ts'
      - 'apps/agent-worker/src/presentation/host-video-spool.ts'
      - 'apps/agent-worker/test/presentation/video-reference-handoff.test.ts'
      - 'packages/ai-gateway/test/minimax-speech.test.ts'
      - 'apps/media-demo/**'
      - 'packages/ai-gateway/test/minimax-video*.test.ts'
      - 'packages/ai-gateway/test/fixtures/minimax-video-sample.mp4'
      - 'packages/ai-gateway/test/fixtures/minimax-reference.png'
      - '.github/workflows/hermes-video.yml'

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Prepare codecs for narrated-video acceptance
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npx pnpm@9.15.0 install --frozen-lockfile
      - run: npx pnpm@9.15.0 --filter @openscience/database generate
      - run: npx pnpm@9.15.0 --filter '@openscience/ai-gateway...' build
      - run: npx pnpm@9.15.0 --filter @openscience/ai-gateway exec vitest run test/minimax-video.test.ts test/minimax-video-download.test.ts test/minimax-speech.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/ai-gateway exec vitest run test/synclip-video-api.test.ts test/synclip-audio-api.test.ts
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/synclip-video-spool.test.ts
      - run: npx pnpm@9.15.0 --filter '@openscience/domain...' build
      - run: npx pnpm@9.15.0 --filter @openscience/agent-worker exec vitest run test/presentation/video-reference-handoff.test.ts
      - name: Synclip offline receipts and Linux frame confinement
        env:
          CI: 'true'
        run: node --test infra/synclip-video/broker.test.mjs infra/synclip-video/image-reference.test.mjs
      - run: bash -n infra/synclip-video/install.sh
      - run: node --test apps/media-demo/test/artwork-explainer.test.mjs apps/media-demo/test/storyboard-input.test.mjs
      - name: Linux root-owned runner recovery, no Docker or provider requests
        run: sudo "$(command -v node)" --test infra/codex-image-runner/core.test.mjs infra/codex-image-runner/video-runner.test.mjs infra/codex-image-runner/minimax-video-pilot.test.mjs infra/codex-image-runner/minimax-video-download.test.mjs infra/codex-image-runner/video-narration-pilot.test.mjs
      - run: npx pnpm@9.15.0 exec eslint packages/ai-gateway/src/minimax-video.ts packages/ai-gateway/src/minimax-video-download.ts packages/ai-gateway/src/minimax-speech.ts packages/ai-gateway/test/minimax-speech.test.ts packages/ai-gateway/test/minimax-video.test.ts packages/ai-gateway/test/minimax-video-download.test.ts
      - run: node --check infra/codex-image-runner/video-runner.mjs && node --check infra/codex-image-runner/minimax-video-pilot.mjs
      - run: git diff --check
