worker_processes 1;
pid /tmp/scansci-runtime/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 128;
}

http {
  access_log off;
  client_body_temp_path /tmp/scansci-runtime/client-body;
  proxy_temp_path /tmp/scansci-runtime/proxy;
  fastcgi_temp_path /tmp/scansci-runtime/fastcgi;
  uwsgi_temp_path /tmp/scansci-runtime/uwsgi;
  scgi_temp_path /tmp/scansci-runtime/scgi;

  server {
    listen 8000;
    server_name _;
    client_max_body_size 1m;

    location /mcp {
      proxy_pass http://127.0.0.1:18080;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:18080;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 420s;
      proxy_send_timeout 420s;
    }
  }
}
