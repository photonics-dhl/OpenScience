# OpenScience ECS egress proxy.
#
# Host clients use the stable loopback endpoint on 7891. The fixed ScanSci
# retrieval subnet may use its fixed bridge-gateway listener on the same port.
# Only verified source domains may use the SSH reverse-tunnel parent on 7890;
# all other ScanSci destinations are resolved and connected DIRECT by this
# Squid instance. Neither listener is allowed on a public interface.

http_port 127.0.0.1:7891 name=loopback_listener
http_port 172.24.0.1:7891 name=scansci_listener

acl loopback src 127.0.0.1/32 ::1
acl loopback_listener myportname loopback_listener
acl scansci_retrieval src 172.24.0.0/24
acl scansci_listener myportname scansci_listener
acl scansci_parent_domains dstdomain .arxiv.org
acl CONNECT method CONNECT
acl SSL_ports port 443
acl blocked_ipv4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_ipv6 dst ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/32 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8

http_access allow loopback loopback_listener
http_access deny scansci_retrieval !scansci_listener
http_access deny scansci_retrieval !CONNECT
http_access deny scansci_retrieval !SSL_ports
http_access deny scansci_retrieval blocked_ipv4
http_access deny scansci_retrieval blocked_ipv6
http_access allow scansci_retrieval scansci_listener CONNECT SSL_ports
http_access deny all

cache_peer 127.0.0.1 parent 7890 0 no-query default name=home_tunnel connect-timeout=2 connect-fail-limit=1
cache_peer_access home_tunnel allow loopback
cache_peer_access home_tunnel allow scansci_retrieval scansci_parent_domains
cache_peer_access home_tunnel deny scansci_retrieval
cache_peer_access home_tunnel deny all

# Unknown ScanSci domains must use the same resolver for the dst ACL and the
# eventual connection. This closes the parent-side second-resolution boundary.
always_direct allow scansci_retrieval !scansci_parent_domains

# Parent first for both cacheable and non-hierarchical requests. DIRECT
# remains eligible when the parent is marked unavailable.
prefer_direct off
nonhierarchical_direct off

# This service is a failover forwarder, not a disk cache.
cache deny all
cache_mem 16 MB
maximum_object_size 0 KB

access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
shutdown_lifetime 2 seconds
