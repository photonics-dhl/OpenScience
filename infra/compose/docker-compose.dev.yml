name: openscience-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openscience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openscience_dev}
      POSTGRES_DB: ${POSTGRES_DB:-openscience}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openscience_minio_dev}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openscience_minio_dev}
      S3_BUCKET: ${S3_BUCKET:-openscience-dev}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 2; done;
      mc mb --ignore-existing \"local/$${S3_BUCKET}\";
      echo BUCKET_READY;
      "

  embedding-model-init:
    build:
      context: ../..
      dockerfile: apps/embedding-worker/Dockerfile
    image: openscience-embedding-worker:dev
    entrypoint: ["python", "/app/model-init.py"]
    command: ["--initialize", "--seed", "/opt/bge-m3-seed", "--target", "/models/bge-m3"]
    user: "10001:10001"
    volumes:
      - bge-m3-5617a9f61b028005a4858fdac845db406aefb181-08cc5a668e89:/models/bge-m3
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    restart: "no"

  embedding-worker:
    image: openscience-embedding-worker:dev
    user: "10001:10001"
    depends_on:
      embedding-model-init:
        condition: service_completed_successfully
    volumes:
      - bge-m3-5617a9f61b028005a4858fdac845db406aefb181-08cc5a668e89:/models/bge-m3:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    mem_limit: 6g
    cpus: 2
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - embedding_net

  scansci-mcp:
    profiles: ["scansci"]
    build:
      context: ../../apps/scansci-mcp
      dockerfile: Dockerfile
      args:
        XGS_RELEASE_IMAGE_TAG: dev
    image: openscience-scansci-mcp:dev
    user: "10001:10001"
    environment:
      TOR_PROXY: socks5h://127.0.0.1:1080
      SCANSCI_TOR_AUTOSTART: "true"
    volumes:
      - scansci-data:/data/scansci
      - scansci-papers:/data/papers
    read_only: true
    tmpfs:
      - /tmp:size=512m,nosuid,nodev,uid=10001,gid=10001,mode=0700
      - /dev/shm:size=512m,nosuid,nodev,uid=10001,gid=10001,mode=0700
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "/opt/scansci/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks: [retrieval_net]

networks:
  embedding_net:
    internal: true
  retrieval_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/24
          gateway: 172.24.0.1

volumes:
  postgres-data:
  redis-data:
  minio-data:
  bge-m3-5617a9f61b028005a4858fdac845db406aefb181-08cc5a668e89:
  scansci-data:
  scansci-papers:
