# OpenScience 生产栈（P1A-9）—— 单 ECS，网络分段对齐 Spec §14.2
#
# 网络拓扑：
#   data_net : postgres + redis + S3-compatible object storage（内部互联，均不绑公网端口）
#   app_net  : web（127.0.0.1:3000）+ api（127.0.0.1:3001），nginx 分流反代
#   api 双网卡（app_net + data_net）→ 仅 API 可达数据服务
#
# 生产纪律：
#   - 零默认值：DB/redis/cookie/SMTP/S3 凭据全从 env_file（/opt/openscience/.env.prod，云上生成不入库）
#   - 代码来自完整 Git commit 的不可变 XGS_RELEASE_ROOT，容器内统一挂载到 /opt/openscience
#   - 对象存储使用 SeaweedFS 单节点 S3 模式；仅 data_net 可达，数据落命名卷
#
# 用法：
#   docker compose -f docker-compose.prod.yml up -d
#   前置：/opt/openscience/.env.prod 存在，XGS_RELEASE_ROOT 已同步并全量 build

name: openscience-prod

services:
  postgres:
    image: postgres:16-alpine
    # 无 ports 映射：仅 data_net 内部可达，不绑公网（§14.2）
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-openscience}
      POSTGRES_SEARCH_DB: ${SEARCH_POSTGRES_DB:-openscience_search}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 无 ports 映射：仅 data_net 内部可达
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data_net
    restart: unless-stopped

  object-storage:
    # SeaweedFS 4.41：活跃维护的 Apache-2.0 S3-compatible store；不暴露宿主端口。
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET required}
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - data_net
    restart: unless-stopped

  api:
    # node:22（debian bookworm full，含 openssl3）—— Prisma engine 与 cloud host build 的
    # debian-openssl-3.0.x 匹配；slim/alpine 缺 openssl 运行时致 engine 加载失败（P1A-9 实证）
    image: node:22
    user: node
    group_add:
      - "11000"
    # 暴露 127.0.0.1:3001 到 host（nginx 反代）；不绑 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    working_dir: /opt/openscience/apps/api
    volumes:
      - ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}:/opt/openscience:ro
    command: ["node", "dist/index.js"]
    env_file:
      - /opt/openscience/.env.prod
    environment:
      S3_DRIVER: minio
      S3_ENDPOINT: object-storage
      S3_PORT: "8333"
      S3_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/auth/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app_net
      - data_net
    restart: unless-stopped

  malware-scanner:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - data_net
    restart: unless-stopped

  agent-worker:
    # Hermes ingestion consumer; no host port, only app/data network access.
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}
      dockerfile: apps/agent-worker/Dockerfile
      network: host
      args:
        XGS_RELEASE_IMAGE_TAG: ${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-agent-worker:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    user: node
    working_dir: /opt/openscience/apps/agent-worker
    volumes:
      - ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}:/opt/openscience:ro
      - parser-jobs:/parser-jobs
      - scansci-papers:/data/papers
    command: ["node", "dist/index.js"]
    env_file:
      - /opt/openscience/.env.prod
    environment:
      S3_DRIVER: minio
      S3_ENDPOINT: object-storage
      S3_PORT: "8333"
      S3_USE_SSL: "false"
      TESSERACT_LANGS: eng+chi_sim
      CLAMAV_HOST: malware-scanner
      CLAMAV_PORT: "3310"
      PARSER_JOB_DIR: /parser-jobs
      BGE_M3_ENABLED: ${BGE_M3_ENABLED:-false}
      BGE_M3_MODEL_VERSION_ID: ${BGE_M3_MODEL_VERSION_ID:-}
      BGE_M3_MODEL_REVISION: ${BGE_M3_MODEL_REVISION:-}
      BGE_M3_SOURCE_SHA256: ${BGE_M3_SOURCE_SHA256:-}
      BGE_M3_PACKAGE_FREEZE_SHA256: ${BGE_M3_PACKAGE_FREEZE_SHA256:-}
      BGE_M3_MODEL_MANIFEST_SHA256: ${BGE_M3_MODEL_MANIFEST_SHA256:-}
      EMBEDDING_WORKER_URL: http://embedding-worker:8080
      SCANSCI_ENABLED: "true"
      SCANSCI_MCP_URL: http://scansci-mcp:8000/mcp
      SCANSCI_PAPERS_DIR: /data/papers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      malware-scanner:
        condition: service_healthy
      document-parser:
        condition: service_healthy
      scansci-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - app_net
      - data_net
      - embedding_net
      - retrieval_net
    restart: unless-stopped

  scansci-mcp:
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}/apps/scansci-mcp
      dockerfile: Dockerfile
      network: host
      args:
        XGS_RELEASE_IMAGE_TAG: ${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-scansci-mcp:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    user: "10001:10001"
    group_add:
      - "11000"
    environment:
      HTTP_PROXY: http://openscience-egress:7891
      HTTPS_PROXY: http://openscience-egress:7891
      NO_PROXY: localhost,127.0.0.1,scansci-mcp
      SCANSCI_PDF_PROXY: http://openscience-egress:7891
      TOR_PROXY: socks5h://127.0.0.1:1080
      SCANSCI_TOR_AUTOSTART: "true"
    extra_hosts:
      - "openscience-egress:172.24.0.1"
    volumes:
      - scansci-data:/data/scansci
      - scansci-papers:/data/papers
    read_only: true
    tmpfs:
      - /tmp:size=512m,nosuid,nodev,uid=10001,gid=10001,mode=0700
      - /dev/shm:size=512m,nosuid,nodev,uid=10001,gid=10001,mode=0700
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
      - retrieval_net
    restart: unless-stopped

  scansci-secret-init:
    image: openscience-scansci-legal:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu; umask 077;
        test -s /host-secrets/scansci_service_token;
        install -o 10001 -g 10001 -m 0400 /host-secrets/scansci_service_token /service-secrets/.scansci_service_token.next;
        mv -f /service-secrets/.scansci_service_token.next /service-secrets/scansci_service_token;
        install -o 1000 -g 1000 -m 0400 /host-secrets/scansci_service_token /worker-secrets/.scansci_service_token.next;
        mv -f /worker-secrets/.scansci_service_token.next /worker-secrets/scansci_service_token;
    volumes:
      - /opt/openscience-secrets/scansci:/host-secrets:ro
      - scansci-service-secrets:/service-secrets
      - scansci-worker-secrets:/worker-secrets
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 16
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  scansci-legal:
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}/apps/scansci-legal
      dockerfile: Dockerfile
      network: host
      args:
        XGS_RELEASE_IMAGE_TAG: ${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
        SCANSCI_ARCHIVE_SHA256: ${SCANSCI_ARCHIVE_SHA256:?SCANSCI_ARCHIVE_SHA256 required}
        SCANSCI_REQUIREMENTS_SHA256: ${SCANSCI_REQUIREMENTS_SHA256:?SCANSCI_REQUIREMENTS_SHA256 required}
        SCANSCI_BUILD_REQUIREMENTS_SHA256: ${SCANSCI_BUILD_REQUIREMENTS_SHA256:?SCANSCI_BUILD_REQUIREMENTS_SHA256 required}
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-scansci-legal:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    user: "10001:10001"
    group_add:
      - "11000"
    environment:
      SCANSCI_ENABLED: "true"
      SCANSCI_HOST: 0.0.0.0
      SCANSCI_PORT: "8080"
      SCANSCI_SERVICE_TOKEN_FILE: /run/secrets/scansci_service_token
      SCANSCI_STRATEGY: legal_only
      SCANSCI_SCIHUB_ENABLED: "false"
      SCANSCI_TOR_ENABLED: "false"
      SCANSCI_EGRESS_PROXY: http://openscience-egress:7891
    extra_hosts:
      - "openscience-egress:172.24.0.1"
    volumes:
      - scansci-session:/session
      - scansci-service-secrets:/run/secrets:ro
      - scansci-browser-inputs:/browser-inputs
      - scansci-browser-outputs:/browser-outputs:ro
    depends_on:
      scansci-secret-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - retrieval_net
    restart: unless-stopped

  scansci-browser:
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}/apps/scansci-legal
      dockerfile: Dockerfile.browser
      network: host
      args:
        XGS_RELEASE_IMAGE_TAG: ${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
        SCANSCI_ARCHIVE_SHA256: ${SCANSCI_ARCHIVE_SHA256:?SCANSCI_ARCHIVE_SHA256 required}
        SCANSCI_REQUIREMENTS_SHA256: ${SCANSCI_REQUIREMENTS_SHA256:?SCANSCI_REQUIREMENTS_SHA256 required}
        SCANSCI_BUILD_REQUIREMENTS_SHA256: ${SCANSCI_BUILD_REQUIREMENTS_SHA256:?SCANSCI_BUILD_REQUIREMENTS_SHA256 required}
        SCANSCI_BROWSER_REQUIREMENTS_SHA256: ${SCANSCI_BROWSER_REQUIREMENTS_SHA256:?SCANSCI_BROWSER_REQUIREMENTS_SHA256 required}
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-scansci-browser:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    user: "10002:11000"
    group_add:
      - "11000"
    environment:
      SCANSCI_BROWSER_PROXY: http://openscience-egress:7891
    extra_hosts:
      - "openscience-egress:172.26.0.1"
    volumes:
      - scansci-browser-inputs:/browser-inputs:ro
      - scansci-browser-outputs:/browser-outputs
      - scansci-browser-profiles:/browser-profile-jobs
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev,uid=10002,gid=11000,mode=0700
      - /dev/shm:size=256m,nosuid,nodev,uid=10002,gid=11000,mode=0700
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "scansci_legal.browser_worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      browser_net:
        ipv4_address: 172.26.0.2
    restart: unless-stopped

  scansci-auth:
    profiles: ["scansci-auth"]
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}/apps/scansci-legal
      dockerfile: Dockerfile.auth
      network: host
      args:
        XGS_RELEASE_IMAGE_TAG: ${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
        SCANSCI_ARCHIVE_SHA256: ${SCANSCI_ARCHIVE_SHA256:?SCANSCI_ARCHIVE_SHA256 required}
        SCANSCI_REQUIREMENTS_SHA256: ${SCANSCI_REQUIREMENTS_SHA256:?SCANSCI_REQUIREMENTS_SHA256 required}
        SCANSCI_BUILD_REQUIREMENTS_SHA256: ${SCANSCI_BUILD_REQUIREMENTS_SHA256:?SCANSCI_BUILD_REQUIREMENTS_SHA256 required}
        SCANSCI_BROWSER_REQUIREMENTS_SHA256: ${SCANSCI_BROWSER_REQUIREMENTS_SHA256:?SCANSCI_BROWSER_REQUIREMENTS_SHA256 required}
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-scansci-auth:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    user: "10001:10001"
    environment:
      SCANSCI_BROWSER_PROXY: http://openscience-egress:7891
    extra_hosts:
      - "openscience-egress:172.25.0.1"
    volumes:
      - scansci-session:/session
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
      - /dev/shm:size=256m,nosuid,nodev,uid=10001,gid=10001,mode=0700
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      auth_net:
        ipv4_address: 172.25.0.2
    restart: "no"

  document-parser:
    # Hostile binary parsing is isolated from production secrets and all networks.
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}
      dockerfile: apps/agent-worker/Dockerfile.parser
      network: host
      args:
        XGS_RELEASE_IMAGE_TAG: ${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-document-parser:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    working_dir: /app
    volumes:
      - parser-jobs:/parser-jobs
    command: ["node", "dist/parser-service.js"]
    environment:
      NODE_ENV: production
      PARSER_JOB_DIR: /parser-jobs
      TESSERACT_LANGS: eng+chi_sim
    network_mode: none
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: 512m
    cpus: 2
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "find /parser-jobs/.ready -mmin -1 -print -quit 2>/dev/null | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  embedding-model-init:
    profiles: ["embedding"]
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}
      dockerfile: apps/embedding-worker/Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-embedding-worker:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    entrypoint: ["python", "/app/model-init.py"]
    command: ["--initialize", "--seed", "/opt/bge-m3-seed", "--target", "/models/bge-m3"]
    user: "10001:10001"
    volumes:
      - bge-m3-5617a9f61b028005a4858fdac845db406aefb181-08cc5a668e89:/models/bge-m3
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    mem_limit: 1g
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  embedding-worker:
    profiles: ["embedding"]
    build:
      context: ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}
      dockerfile: apps/embedding-worker/Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
    image: openscience-embedding-worker:${XGS_RELEASE_IMAGE_TAG:?XGS_RELEASE_IMAGE_TAG required}
    user: "10001:10001"
    volumes:
      - bge-m3-5617a9f61b028005a4858fdac845db406aefb181-08cc5a668e89:/models/bge-m3:ro
    depends_on:
      embedding-model-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    mem_limit: 6g
    cpus: 2
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks:
      - embedding_net
    restart: unless-stopped

  web:
    image: node:22
    user: node
    ports:
      - "127.0.0.1:3000:3000"
    working_dir: /opt/openscience/apps/web
    volumes:
      - ${XGS_RELEASE_ROOT:?XGS_RELEASE_ROOT required}:/opt/openscience:ro
    tmpfs:
      - /opt/openscience/apps/web/.next/cache:size=256m,uid=1000,gid=1000,mode=0750
    command: ["npm", "run", "start"]
    env_file:
      - /opt/openscience/.env.prod
    environment:
      API_ORIGIN: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

networks:
  data_net:
    driver: bridge
    internal: false
  app_net:
    driver: bridge
  embedding_net:
    driver: bridge
    internal: true
  retrieval_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/24
          gateway: 172.24.0.1
  browser_net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: xgs-browser0
    ipam:
      config:
        - subnet: 172.26.0.0/24
          gateway: 172.26.0.1
  auth_net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: xgs-auth0
    ipam:
      config:
        - subnet: 172.25.0.0/29
          gateway: 172.25.0.1

volumes:
  postgres-data:
  redis-data:
  seaweed-data:
  parser-jobs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m,uid=1000,gid=1000,mode=0770
  clamav-data:
  scansci-session:
  scansci-service-secrets:
  scansci-worker-secrets:
  scansci-browser-inputs:
    driver: local
