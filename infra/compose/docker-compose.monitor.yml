# OpenScience 监控栈 —— Netdata 实时面板（P1A 运维补充，2026-08-01）
#
# 用途：服务器实时资源/流量面板，经 nginx 反代暴露于
#   https://portainer.428312321.xyz/monitor/（basic_auth，见 infra/nginx/portainer.conf）
# 月度流量账单（阿里云按量计费口径）由宿主机 vnStat 提供：
#   https://portainer.428312321.xyz/traffic/（infra/scripts/traffic-report.sh 生成）
#
# 部署（云上，详见 docs/runbooks/monitoring.md）：
#   docker compose -f /opt/monitor/docker-compose.monitor.yml up -d
#
# 安全：面板仅绑 127.0.0.1:19999，公网唯一入口为带 basic_auth 的 nginx 路径；
# 容器仅挂载明确指标文件和空的 rootFS 容量探针，无主机根目录或整棵 proc。

name: openscience-monitor

x-host-metric: &host-metric
  type: bind
  read_only: true
  bind:
    create_host_path: false

services:
  netdata:
    # Inspected production RepoDigest, 2026-10-14. Retain its cached image before
    # a planned rebuild; no mutable-tag fallback or automatic pull.
    image: ${NETDATA_IMAGE:-netdata/netdata@sha256:689145f603fed0ca341b4d8a0fb9910cd9d8c0590b0530cd24ae1912a9c7f8f3}
    mem_limit: 1536m
    cpus: 2
    container_name: netdata
    hostname: openscience-ecs
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:19999:19999"
    # Required charts: host CPU/RAM/disk-space/interface counters. Namespace
    # mapping/process attribution are omitted; container management uses Portainer.
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      # Provisioned privately on the host; never copy SMTP credentials into Git.
      - type: bind
        source: /opt/monitor/msmtprc
        target: /etc/msmtprc
        read_only: true
        bind:
          create_host_path: false
      # Prepared/checked only in the existing monitor maintenance procedure.
      # Same host root filesystem, empty directory; statvfs needs no host files.
      - <<: *host-metric
        source: /opt/monitor/root-filesystem
        target: /host/root
      # One root filesystem record targets /host/root in the collector fallback.
      # No /host/root/proc/1 or host /proc directory, so no PID/root magic links.
      - <<: *host-metric
        source: /opt/monitor/root-mountinfo
        target: /host/proc/self/mountinfo
      - <<: *host-metric
        source: /proc/stat
        target: /host/proc/stat
      - <<: *host-metric
        source: /proc/meminfo
        target: /host/proc/meminfo
      - <<: *host-metric
        source: /proc/vmstat
        target: /host/proc/vmstat
      - <<: *host-metric
        source: /proc/diskstats
        target: /host/proc/diskstats
      - <<: *host-metric
        source: /proc/loadavg
        target: /host/proc/loadavg
      - <<: *host-metric
        source: /proc/uptime
        target: /host/proc/uptime
      - <<: *host-metric
        source: /proc/net/dev
        target: /host/proc/net/dev
      - <<: *host-metric
        source: /sys/devices/system/cpu
        target: /host/sys/devices/system/cpu
      - <<: *host-metric
        source: /etc/localtime
        target: /etc/localtime
      - <<: *host-metric
        source: /etc/os-release
        target: /host/etc/os-release

  # vnStat 流量记账：host 网络读宿主机网卡计数器，数据持久化到 vnstatdb 卷。
  # 账单页由宿主机 cron 调 `docker exec vnstat vnstat --json` 渲染（infra/scripts/traffic-report.sh）。
  vnstat:
    image: alpine:3.20
    mem_limit: 128m
    cpus: 0.25
    container_name: vnstat
    restart: unless-stopped
    network_mode: host
    entrypoint:
      - sh
      - -c
      - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/' /etc/apk/repositories
        && apk add --no-cache vnstat >/dev/null && exec vnstatd --nodaemon
    volumes:
      - vnstatdb:/var/lib/vnstat

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  vnstatdb:
