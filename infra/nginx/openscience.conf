# OpenScience 反代 —— / → 127.0.0.1:3000（Next Web），API/auth/admin → 127.0.0.1:3001（Fastify）
#
# P1A-8：/admin 更强认证（nginx basic_auth 一层，决策 ADR-003）。
#   - 凭据文件 /etc/nginx/.htpasswd-admin（云上生成，不入库，同 /monitor/ .htpasswd-monitor 惯例）
#   - 双层：nginx basic_auth（传输层挡未授权）+ 应用层 platform_admin 角色 + 审计
#   - TOTP 二次验证列为上线路障（web 有 UI 后补，见 ADR-003）
#
# 部署步骤（对应 docs/runbooks/deployment.md）：
#   1. 签发证书（standalone，需 80 空闲）：
#        ~/.acme.sh/acme.sh --issue -d OpenScience.428312321.xyz --standalone --server letsencrypt
#   2. 安装证书 + 自动续期 reload：
#        ~/.acme.sh/acme.sh --install-cert -d OpenScience.428312321.xyz \
#          --key-file       /etc/nginx/ssl/openscience/key.pem \
#          --fullchain-file /etc/nginx/ssl/openscience/fullchain.pem \
#          --reloadcmd      "systemctl reload nginx"
#   3. 生成 /admin basic_auth 凭据（nginx 层第二重认证）：
#        htpasswd -bc /etc/nginx/.htpasswd-admin <admin-user> '<强密码>'
#        chmod 640 /etc/nginx/.htpasswd-admin && chown root:nginx /etc/nginx/.htpasswd-admin
#   4. 本文件上传 /etc/nginx/conf.d/openscience.conf，然后：
#        nginx -t && systemctl reload nginx
#   5. 验证：
#        curl -sI https://OpenScience.428312321.xyz/auth/me            # 401（未登录）
#        curl -sI -u <admin-user> https://OpenScience.428312321.xyz/admin/   # 401 或 200（basic_auth 放行后由 API 判权限）
#
# 注意：API 限流（P1A-8）依赖 req.ip 取真实客户端 IP，Fastify 侧
# trustProxy:1 只信任一层 nginx。Tunnel 回源只来自 loopback cloudflared；
# nginx 将受信 CF-Connecting-IP 写入 $remote_addr，并统一覆盖 XFF 防伪造。

server {
    server_tokens off;
    listen 80;
    server_name OpenScience.428312321.xyz;

    # acme.sh webroot 续期验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_tokens off;
    listen 443 ssl;
    http2 on;
    server_name OpenScience.428312321.xyz;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    ssl_certificate     /etc/nginx/ssl/openscience/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/openscience/key.pem;

    client_max_body_size 50m;
    add_header X-Content-Type-Options "nosniff" always;

    # Only Nginx-generated errors; application JSON errors keep their payloads.
    error_page 500 = @browser_error_500;
    error_page 502 = @browser_error_502;
    error_page 503 = @browser_error_503;
    error_page 504 = @browser_error_504;

    # Public, non-secret immutable release identity for acceptance evidence.
    # Optional reviewed demo; absent on fresh installations.
    include /etc/nginx/snippets/science-video-demo*.location.conf;
    location = /__release {
        default_type text/plain;
        alias /opt/openscience/.release-id;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # Curator UI must enter the same Basic Auth realm before its browser requests
    # the /admin/editorial API. The page itself remains a Next route.
    location ^~ /editorial/curator {
        error_page 401 = @browser_unauthorized;
        error_page 403 = @browser_forbidden;
        auth_basic "openscience-admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    # Journal administrators use their website session (approved 2026-09-16).
    # Fail closed at the edge; the API also checks the current database role.
    # Other administration paths retain the independent Basic Auth policy.
    location = /_journal_admin_auth {
        internal;
        proxy_pass http://127.0.0.1:3001/auth/journal-admin-access;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location @journal_admin_signin {
        return 302 /auth/login?returnTo=%2Fadmin%2Fjournals;
    }

    location = /admin/journals {
        error_page 403 = @browser_forbidden;
        auth_request /_journal_admin_auth;
        error_page 401 = @journal_admin_signin;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    location = /admin/journals/ {
        return 308 /admin/journals;
    }

    location = /api/admin/journals {
        auth_request /_journal_admin_auth;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://127.0.0.1:3001/admin/journals;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    location ^~ /api/admin/journals/ {
        auth_request /_journal_admin_auth;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://127.0.0.1:3001/admin/journals/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    # /admin 前缀：nginx basic_auth 一层（强认证，ADR-003）；放行后转 API，由 platform_admin 角色 + 审计继续把关
    location /admin/ {
        error_page 401 = @browser_unauthorized;
        error_page 403 = @browser_forbidden;
        auth_basic "openscience-admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    # Admin APIs keep the same transport-layer Basic Auth as /admin/*.
    location ^~ /api/admin/ {
        auth_basic "openscience-admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass http://127.0.0.1:3001/admin/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    location /api/ {
        # Browser API namespace is /api/*; trailing slash strips /api/
        # before forwarding to Fastify's canonical root routes.
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Browser identity pages are Next routes. Exact matches take precedence over
    # the legacy direct /auth/* Fastify namespace retained below for API clients.
    location = /auth/login {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/register {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|agent|sandbox-jobs|versions)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @browser_unauthorized {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header WWW-Authenticate "Basic realm=\"openscience-admin\"" always;
        return 401 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需要登录 · OpenScience</title><main><h1>OpenScience · 需要登录</h1><p>请先登录，并使用获授权的管理员凭据。</p><p><a href="/">返回首页</a> · <a href="/auth/login">登录</a></p></main></html>';
    }

    location @browser_forbidden {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 403 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无权访问 · OpenScience</title><main><h1>OpenScience · 无权访问</h1><p>当前账号没有访问此页面的权限。</p><p><a href="/">返回首页</a> · <a href="/auth/login">登录</a></p></main></html>';
    }

    location @browser_error_500 {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 500 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务暂时不可用 · OpenScience</title><main><h1>OpenScience · 服务暂时不可用</h1><p>服务遇到错误，请稍后重试。</p><p><a href="/">返回首页</a> · <a href="/auth/login">登录</a></p></main></html>';
    }

    location @browser_error_502 {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 502 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务暂时不可用 · OpenScience</title><main><h1>OpenScience · 服务暂时不可用</h1><p>服务正在恢复，请稍后重试。</p><p><a href="/">返回首页</a> · <a href="/auth/login">登录</a></p></main></html>';
    }

    location @browser_error_503 {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务暂时不可用 · OpenScience</title><main><h1>OpenScience · 服务暂时不可用</h1><p>服务暂时繁忙，请稍后重试。</p><p><a href="/">返回首页</a> · <a href="/auth/login">登录</a></p></main></html>';
    }

    location @browser_error_504 {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 504 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务暂时不可用 · OpenScience</title><main><h1>OpenScience · 服务暂时不可用</h1><p>请求等待超时，请稍后重试。</p><p><a href="/">返回首页</a> · <a href="/auth/login">登录</a></p></main></html>';
    }
}
