# OpenScience managed science-video demo location
# Included inside the OpenScience TLS server block. __RUN_ID__ is replaced only
# by infra/scripts/deploy-science-video-demo.sh after a bounded render succeeds.

location = /demos/science-video/d2nn {
    return 308 /demos/science-video/d2nn/;
}

location = /demos/science-video/d2nn/ {
    alias /opt/openscience-demos/science-video/d2nn/releases/__RUN_ID__/web/index.html;
    default_type text/html;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location = /demos/science-video/d2nn/styles.css {
    alias /opt/openscience-demos/science-video/d2nn/releases/__RUN_ID__/web/styles.css;
    default_type text/css;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /demos/science-video/d2nn/player.js {
    alias /opt/openscience-demos/science-video/d2nn/releases/__RUN_ID__/web/player.js;
    default_type application/javascript;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /demos/science-video/d2nn/d2nn-science-explainer-v2.mp4 {
    alias /opt/openscience-demos/science-video/d2nn/releases/__RUN_ID__/output/d2nn-science-explainer-v2.mp4;
    default_type video/mp4;
    limit_except GET HEAD { deny all; }
    add_header Accept-Ranges "bytes" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /demos/science-video/d2nn/poster-v2.png {
    alias /opt/openscience-demos/science-video/d2nn/releases/__RUN_ID__/output/poster-v2.png;
    default_type image/png;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=300" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}
