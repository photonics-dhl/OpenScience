# Portainer 面板反代 —— portainer.428312321.xyz → 127.0.0.1:9443（Portainer 容器，自签上游）
#
# 部署步骤（对应 docs/runbooks/deployment.md；执行前确认安全组已放行 80/443）：
#   1. 签发证书（standalone，需 80 空闲——先不要 start nginx）：
#        ~/.acme.sh/acme.sh --issue -d portainer.428312321.xyz --standalone --server letsencrypt
#   2. 安装证书到 nginx 路径并挂自动续期 reload：
#        mkdir -p /etc/nginx/ssl/portainer.428312321.xyz
#        ~/.acme.sh/acme.sh --install-cert -d portainer.428312321.xyz \
#          --key-file       /etc/nginx/ssl/portainer.428312321.xyz/key.pem \
#          --fullchain-file /etc/nginx/ssl/portainer.428312321.xyz/fullchain.pem \
#          --reloadcmd      "systemctl reload nginx"
#   3. 本文件上传到 /etc/nginx/conf.d/portainer.conf，然后：
#        nginx -t && systemctl enable --now nginx
#   4. 验证：本地 curl -sI https://portainer.428312321.xyz 应返回 200（Portainer 登录页）
#
# 安全说明：面板认证依赖 Portainer 自身账号密码（setup token 已消费）；upstream 为容器自签证书，
# 故 proxy_ssl_verify off（仅本机回环，风险可接受）。如需二次防护可叠加 nginx basic_auth。
#
# 2026-08-01 追加：同域下挂监控面板两个路径（均 basic_auth，凭据文件 /etc/nginx/.htpasswd-monitor）：
#   /monitor/ → Netdata 实时面板（127.0.0.1:19999，infra/compose/docker-compose.monitor.yml）
#   /traffic/ → vnStat 流量账单静态页（/var/www/traffic，infra/scripts/traffic-report.sh 每 5min 生成）

# WebSocket Connection 头映射：仅当客户端带 Upgrade 时才发 Connection: upgrade，
# 否则 Netdata 会对带 "Connection: upgrade" 但无 Upgrade 头的普通请求回 400。
map $http_upgrade $monitor_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name portainer.428312321.xyz;

    # acme.sh webroot 续期验证路径（--install-cert 后续期走 webroot，不再占用 80）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portainer.428312321.xyz;

    ssl_certificate     /etc/nginx/ssl/portainer.428312321.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portainer.428312321.xyz/key.pem;

    client_max_body_size 50m;

    # Netdata 实时面板（basic_auth；子路径反代，官方 nginx subfolder 模式）
    location ~ ^/monitor/(?<ndpath>.*)$ {
        auth_basic "openscience-monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-monitor;

        proxy_pass http://127.0.0.1:19999/$ndpath$is_args$args;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;

        # Netdata 实时图表依赖 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $monitor_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        gzip off;
        proxy_store off;
        proxy_read_timeout 3600s;
    }

    # 服务器面板导航页（/var/www/nav 静态页，三个入口互跳）
    location = /nav {
        return 301 /nav/;
    }
    location /nav/ {
        auth_basic "openscience-monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-monitor;

        alias /var/www/nav/;
        index index.html;
        autoindex off;
    }

    # vnStat 流量账单静态页（/var/www/traffic，traffic-report.sh 每 5 分钟生成）
    location /traffic/ {
        auth_basic "openscience-monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-monitor;

        alias /var/www/traffic/;
        index index.html;
        autoindex off;
        expires 60s;
    }

    location / {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;

        # Portainer 依赖 WebSocket（容器控制台/实时日志）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
