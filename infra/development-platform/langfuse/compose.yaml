name: openscience-development-langfuse

x-service: &service
  restart: unless-stopped
  networks: [private]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-app-env: &app-env
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:?generated by install.sh}
  DATABASE_URL: ${LANGFUSE_DATABASE_URL:?generated by install.sh}
  SALT: ${LANGFUSE_SALT:?generated by install.sh}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?generated by install.sh}
  TELEMETRY_ENABLED: "false"
  DO_NOT_TRACK: "1"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  LANGFUSE_IN_APP_AGENT_ENABLED: "false"
  LANGFUSE_EVALUATOR_MEDIA_TRANSPORT: disabled
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?generated by install.sh}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  CLICKHOUSE_MAX_OPEN_CONNECTIONS: "5"
  CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY: "536870912"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?generated by install.sh}
  LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?generated by install.sh}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_EVENT_KEY_MAX_SEGMENT_BYTES: "255"
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  LANGFUSE_OTEL_MEDIA_UPLOAD_ENABLED: "false"
  LANGFUSE_LOG_LEVEL: warn
  LANGFUSE_LOG_FORMAT: json

x-depends: &depends
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  minio: {condition: service_healthy}

services:
  web:
    <<: *service
    image: langfuse/langfuse:4.35.0@sha256:a5d8d2457702ab7e051bc0788d73871970caebd10aae6635e87cfb736e4067cd
    depends_on: *depends
    networks:
      private: {}
      telemetry-ingest:
        aliases: [development-langfuse-web]
    mem_limit: 2g
    cpus: "1.0"
    env_file: [/etc/openscience-development/langfuse/bootstrap.env]
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=1408
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?generated by install.sh}
      NEXTAUTH_COOKIE_NAME_SUFFIX: xgs-development
      AUTH_DISABLE_SIGNUP: "true"
      AUTH_DISABLE_USERNAME_PASSWORD: "false"
      AUTH_EMAIL_VERIFICATION_REQUIRED: "false"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    <<: *service
    image: langfuse/langfuse-worker:4.35.0@sha256:5e35e625a214dd868bb22adad90fc52e8f83cc856c3750e47f9a922622c207fb
    depends_on: *depends
    mem_limit: 1536m
    cpus: "1.0"
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=1024
      LANGFUSE_INGESTION_QUEUE_PROCESSING_CONCURRENCY: "2"
      LANGFUSE_OTEL_INGESTION_QUEUE_PROCESSING_CONCURRENCY: "2"
      LANGFUSE_INGESTION_CLICKHOUSE_WRITE_BATCH_SIZE: "100"
      LANGFUSE_S3_CONCURRENT_WRITES: "4"
      QUEUE_CONSUMER_IN_APP_AGENT_RUN_QUEUE_IS_ENABLED: "false"
      QUEUE_CONSUMER_CREATE_EVAL_QUEUE_IS_ENABLED: "false"
      QUEUE_CONSUMER_EVAL_EXECUTION_QUEUE_IS_ENABLED: "false"
      QUEUE_CONSUMER_EVAL_EXECUTION_SECONDARY_QUEUE_IS_ENABLED: "false"
      QUEUE_CONSUMER_CODE_EVAL_EXECUTION_QUEUE_IS_ENABLED: "false"
      QUEUE_CONSUMER_EXPERIMENT_CREATE_QUEUE_IS_ENABLED: "false"
      QUEUE_CONSUMER_POSTHOG_INTEGRATION_QUEUE_IS_ENABLED: "false"
      QUEUE_CONSUMER_MIXPANEL_INTEGRATION_QUEUE_IS_ENABLED: "false"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s

  postgres:
    <<: *service
    image: postgres:16-alpine
    mem_limit: 512m
    cpus: "0.25"
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?generated by install.sh}
      TZ: UTC
      PGTZ: UTC
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, langfuse, -d, langfuse]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *service
    image: redis:7-alpine
    mem_limit: 512m
    cpus: "0.25"
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?generated by install.sh}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    <<: *service
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    user: "101:101"
    mem_limit: 3g
    cpus: "1.5"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?generated by install.sh}
      TZ: UTC
    volumes:
      - clickhouse:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/openscience.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:8123/ping]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    <<: *service
    image: cgr.dev/chainguard/minio:latest@sha256:ad4a4c0a39ad7b71408124fe3df07b1b2e9d2959a369fac8754d2ef3311b5c20
    mem_limit: 512m
    cpus: "0.25"
    entrypoint: sh
    command: [-c, 'mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data']
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?generated by install.sh}
      MINIO_BROWSER: "off"
    volumes: [minio:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  private:
    name: openscience-development-langfuse-private
    internal: true
  telemetry-ingest:
    name: openscience-development-telemetry-ingest
    external: true

volumes:
  postgres: {name: openscience-development-langfuse-postgres}
  redis: {name: openscience-development-langfuse-redis}
  clickhouse: {name: openscience-development-langfuse-clickhouse}
  clickhouse-logs: {name: openscience-development-langfuse-clickhouse-logs}
  minio: {name: openscience-development-langfuse-minio}
