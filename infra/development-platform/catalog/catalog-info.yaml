spec:
  type: website
  lifecycle: production
  owner: group:default/openscience-maintainers
  system: openscience
  consumesApis: [public-research-api]
  dependsOn: [component:default/api, resource:production/application]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: api
  title: OpenScience API
  description: Fastify boundary for research, workspaces, publication and durable Hermes tasks.
  annotations:
    backstage.io/source-location: url:https://github.com/photonics-dhl/OpenScience/tree/codex/onchip-video-release/apps/api/
