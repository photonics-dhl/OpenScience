# Standard Backstage entities. This file is a maintained inventory, not a live
# release database or evidence that a capability produced correct results.
# Production release/rollback and candidate status remain in the CURRENT handoff.
# Repository links follow the active delivery branch, whose requirements include
# current user decisions. They are navigation, not a deployed source snapshot.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: openscience-maintainers
  title: OpenScience maintainers
  description: Repository maintenance ownership; this entry grants no application or server permissions.
  links:
    - url: https://github.com/photonics-dhl/OpenScience
      title: OpenScience repository
spec:
  type: team
  profile:
    displayName: OpenScience maintainers
  children: []
  members: [dhl]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: dhl
  title: DHL
  description: Repository owner contact; catalog identity is not a Backstage login or an authorization grant.
  links:
    - url: https://github.com/photonics-dhl
      title: Repository owner
spec:
  profile:
    displayName: DHL
  memberOf: [openscience-maintainers]
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: research-infrastructure
  title: Research infrastructure
  annotations:
    backstage.io/source-location: url:https://github.com/photonics-dhl/OpenScience/tree/codex/onchip-video-release/docs/
spec:
  owner: group:default/openscience-maintainers
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: openscience
  title: OpenScience product
  description: Research objects, source-grounded understanding, collaboration and publication. Inventory membership is not a quality claim.
  annotations:
    backstage.io/source-location: url:https://github.com/photonics-dhl/OpenScience/tree/codex/onchip-video-release/
  links:
    - url: https://github.com/photonics-dhl/OpenScience/blob/codex/onchip-video-release/docs/handoff/2026-09-10-hermes-web-image-handoff.md
      title: CURRENT release, rollback, candidates and observed limitations
    - url: https://github.com/photonics-dhl/OpenScience/blob/codex/onchip-video-release/docs/OpenScience_Kimi_Development_Spec.md
      title: Requirements baseline
    - url: https://github.com/photonics-dhl/OpenScience/blob/codex/onchip-video-release/.taskmaster/state.json
      title: Current Taskmaster tag selector
    - url: https://github.com/photonics-dhl/OpenScience/blob/codex/onchip-video-release/.taskmaster/tasks/tasks.json
      title: Stable acceptance tasks by tag
spec:
  owner: group:default/openscience-maintainers
  domain: research-infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: development-platform
  title: OpenScience development capabilities
  description: Code discovery, service ownership, trace inspection and reusable skills. Separate from research publication authorization and quality review.
  annotations:
    backstage.io/source-location: url:https://github.com/photonics-dhl/OpenScience/tree/codex/onchip-video-release/infra/development-platform/
spec:
  owner: group:default/openscience-maintainers
  domain: research-infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: web
  title: OpenScience web
  annotations:
    backstage.io/source-location: url:https://github.com/photonics-dhl/OpenScience/tree/codex/onchip-video-release/apps/web/
