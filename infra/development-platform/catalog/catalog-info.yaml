  lifecycle: production
  owner: group:default/openscience-maintainers
  system: openscience
  providesApis: [public-research-api]
  dependsOn:
    - resource:production/application
    - resource:production/research-database
    - resource:production/redis
    - resource:production/object-storage
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: agent-worker
  title: Hermes agent worker
  description: Durable research tasks use the existing Gateway, parser and explicitly imported runtime skills. Success status does not establish scientific quality.
  annotations:
    backstage.io/source-location: url:https://github.com/photonics-dhl/OpenScience/tree/codex/onchip-video-release/apps/agent-worker/
  tags: [hermes, worker]
  links:
    - url: https://github.com/photonics-dhl/OpenScience/blob/codex/onchip-video-release/docs/runbooks/hermes-capability-registry.md
      title: Capability purpose, real consumers and observed results
spec:
  type: service
  lifecycle: production
  owner: group:default/openscience-maintainers
  system: openscience
  consumesApis: [scansci-mcp-api]
  dependsOn:
    - component:default/ai-gateway
    - component:default/research-skills
    - component:default/document-parser
    - resource:production/application
    - resource:production/research-database
    - resource:production/object-storage
